# Veröffentlicht den Konfigurator bei jedem Push als Test-URL auf GitHub Pages:
# https://dannyclees.github.io/pergola-konfigurator/
# Einmalig nötig: Settings → Pages → Source „GitHub Actions“.
name: Test-URL (GitHub Pages)

on:
  push:
    branches: [claude/quirky-brahmagupta-5xludd]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp index.html embed.js demo.html _site/
          cp -r assets _site/
          # Testversion nicht von Suchmaschinen indexieren lassen
          sed -i 's#<meta charset="utf-8">#<meta charset="utf-8">\n<meta name="robots" content="noindex, nofollow">#' _site/index.html
          grep -q 'name="robots"' _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
