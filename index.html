<style>
/* =====================================================================
   DESIGN-TOKENS – Akzentfarbe hier anpassen (später aus dem CG-Atelier-Logo)
   ===================================================================== */
:root {
  --accent: #7B5B3A;          /* Primärbutton, aktive Auswahl (weißer Text darauf: 6,2:1) */
  --accent-ink: #FFFFFF;
  --accent-soft: #F1EAE2;     /* Hintergrund ausgewählter Karten */
  --bg: #F7F5F2;              /* Warmweiß */
  --card: #FFFFFF;
  --text: #2B2D30;            /* Anthrazit */
  --muted: #5C5F64;
  --line: #E4E0DA;
  --field: #8F8B85;           /* Rahmen von Eingabefeldern (≥ 3:1) */
  --seg: #EDEAE5;
  --error: #B3261E;
  --ok: #2E6B3F;
  --radius: 12px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
body {
  font-family: var(--font); font-size: 17px; line-height: 1.47; color: var(--text);
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus { outline: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.blur { filter: blur(7px); user-select: none; -webkit-user-select: none; pointer-events: none; }
.price-value.locked { cursor: pointer; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
[hidden] { display: none !important; }

/* ---------- App-Rahmen ---------- */
.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; width: 100%; overflow: hidden; }
.topbar {
  flex: 0 0 auto; display: flex; align-items: center; gap: 12px;
  height: 56px; padding: 0 16px; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right));
  border-bottom: 1px solid var(--line); background: var(--bg);
}
.logo { display: flex; flex-direction: column; line-height: 1.1; white-space: nowrap; }
.logo b { font-weight: 700; font-size: 15px; letter-spacing: .16em; text-transform: uppercase; }
.logo span { font-size: 12px; color: var(--muted); letter-spacing: .02em; }
.progress { flex: 1; display: flex; gap: 4px; max-width: 520px; margin: 0 auto; min-width: 0; }
.progress button {
  flex: 1; min-width: 0; height: 44px; padding: 0; border: 0; background: none;
  display: flex; align-items: center;
}
.progress button span { display: block; width: 100%; height: 4px; border-radius: 2px; background: var(--line); transition: background .25s; }
.progress button.done span { background: var(--text); }
.progress button.current span { background: var(--accent); }
.progress button:disabled { cursor: default; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 22px; padding: 2px; background: var(--card); }
.lang button {
  min-width: 44px; height: 40px; border: 0; background: none; border-radius: 20px;
  font-size: 15px; font-weight: 600; color: var(--muted);
}
.lang button[aria-pressed="true"] { background: var(--text); color: #fff; }

.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 62fr) minmax(400px, 38fr); }

/* ---------- 3D-Vorschau ---------- */
.viewer { position: relative; min-height: 0; overflow: hidden; background: #E8EDF0; touch-action: none; }
.viewer canvas { display: block; width: 100% !important; height: 100% !important; }
.canvas-host { position: absolute; inset: 0; }
.viewer-status {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: 24px; text-align: center; color: var(--muted); font-size: 15px;
}
.viewer-status .fallback {
  max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px; color: var(--text);
}
.viewer-top { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; }
.viewer-top > * { pointer-events: auto; }
.daynight { display: flex; background: rgba(255,255,255,.92); border: 1px solid var(--line); border-radius: 22px; padding: 2px; }
.daynight button {
  display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 0; background: none;
  border-radius: 20px; font-size: 15px; font-weight: 500; color: var(--muted);
}
.daynight button svg { width: 18px; height: 18px; }
.daynight button[aria-pressed="true"] { background: var(--text); color: #fff; }
.drag-hint {
  background: rgba(43,45,48,.82); color: #fff; font-size: 13px; padding: 8px 12px; border-radius: 16px;
  transition: opacity .4s;
}
.drag-hint.gone { opacity: 0; pointer-events: none; }
.viewer-bottom {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
  width: min(420px, calc(100% - 24px)); display: flex; align-items: center; gap: 12px;
  background: rgba(255,255,255,.94); border: 1px solid var(--line); border-radius: 26px; padding: 0 16px 0 18px;
}
.viewer-bottom label { font-size: 15px; font-weight: 500; white-space: nowrap; }
.viewer-bottom input { flex: 1; min-width: 0; }
.viewer-left { display: flex; gap: 8px; flex-wrap: wrap; }
.sun-btn { display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--line);
  background: rgba(255,255,255,.92); font-size: 15px; font-weight: 500; color: var(--text); }
.sun-btn svg { width: 18px; height: 18px; color: var(--accent); }
.sun-btn[aria-expanded="true"] { background: var(--text); color: #fff; border-color: var(--text); }
.sun-btn[aria-expanded="true"] svg { color: #fff; }
.sun-panel {
  position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); width: min(500px, calc(100% - 24px));
  background: rgba(255,255,255,.96); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px;
  display: flex; flex-direction: column; gap: 8px;
}
.sun-row { display: flex; align-items: center; gap: 8px; }
.sun-row input[type="range"] { flex: 1; min-width: 0; }
.sun-row output { min-width: 62px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.sun-row .seg { flex: 1; min-width: 0; }
.sun-row .seg button { min-height: 40px; font-size: 14px; padding: 4px 6px; }
.sun-row select { height: 44px; max-width: 46%; border: 1px solid var(--field); border-radius: 10px; background: var(--card); padding: 0 8px; font-size: 15px; }
.sun-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.sun-row input[type="date"] { height: 44px; width: 150px; flex: 0 0 auto; border: 1px solid var(--field); border-radius: 10px; background: var(--card); padding: 0 8px; font-size: 15px; }
.sun-place { align-items: center; }
.sun-meta > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sun-row .seg button { white-space: nowrap; }
.sun-place .linkbtn { font-size: 13px; padding: 0; }
.addr { display: flex; gap: 8px; }
.addr input { flex: 1; min-width: 0; height: 48px; padding: 0 14px; border: 1px solid var(--field); border-radius: 10px; background: var(--card); font-size: 17px; }
.addr .btn { min-height: 48px; padding: 0 16px; }
.geo-status { font-size: 15px; color: var(--muted); margin: 10px 0 0; }
.geo-status.err { color: var(--error); }
.geo-results { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.geo-results button { text-align: left; min-height: 44px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); font-size: 15px; }
.site-line { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 15px; font-weight: 500; }
.site-line svg { width: 18px; height: 18px; color: var(--accent); flex: 0 0 auto; }
.plan { position: relative; margin-top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; }
.plan svg.map { display: block; width: 100%; height: auto; max-height: 300px; touch-action: manipulation; }
.plan .edge-hit { stroke: transparent; cursor: pointer; }
.plan .edge-hit:hover + .edge-vis, .plan .edge-hit:focus-visible + .edge-vis { stroke: var(--accent); }
.plan .edge-hit:focus-visible { outline: none; }
.plan .north { position: absolute; top: 10px; right: 12px; font-size: 13px; font-weight: 700; display: flex; flex-direction: column; align-items: center; line-height: 1; }
.plan small { display: block; font-size: 12px; color: var(--muted); padding: 4px 4px 0; }
.fine-row { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.fine-row label { font-size: 15px; font-weight: 600; white-space: nowrap; }
.fine-row output { min-width: 92px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 15px; }
@media (max-width: 400px) { .sun-row input[type="date"] { width: 118px; font-size: 13px; } .sun-row .seg button { font-size: 12px; } }
.icon-btn.round { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #fff; border-color: var(--accent); }
.compass { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.compass button { min-height: 48px; border: 1px solid var(--line); background: var(--card); border-radius: 10px; font-size: 15px; font-weight: 600; color: var(--text); }
.compass button small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
.compass button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.viewer-bottom output { font-size: 13px; color: var(--muted); min-width: 36px; text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- Panel ---------- */
.panel { position: relative; display: flex; flex-direction: column; min-height: 0; background: var(--bg); border-left: 1px solid var(--line); }
.panel-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; padding: 32px 32px 32px; -webkit-overflow-scrolling: touch; }
.step { animation: stepIn .35s ease both; }
@keyframes stepIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.eyebrow { margin: 0 0 6px; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0 0 8px; font-size: 26px; line-height: 1.2; font-weight: 600; letter-spacing: -.015em; }
h2 { margin: 28px 0 12px; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sub { margin: 0 0 24px; color: var(--muted); }
.lede { margin: -8px 0 24px; font-weight: 500; }
.note { font-size: 15px; color: var(--muted); margin: 12px 0 0; }

/* Auswahlkarten */
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.card {
  position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left;
  min-height: 132px; padding: 16px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  transition: border-color .2s, background .2s;
}
.card:hover { border-color: #C9C3BA; }
.card svg.ic { width: 28px; height: 28px; color: var(--accent); margin-bottom: 4px; }
.card .t { font-weight: 600; line-height: 1.3; }
.card .d { font-size: 15px; color: var(--muted); line-height: 1.4; }
.card .extra { font-size: 13px; font-weight: 600; color: var(--accent); }
.card[aria-pressed="true"], .model-card[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.check {
  position: absolute; top: 12px; right: 12px; width: 24px; height: 24px; border-radius: 50%;
  background: var(--accent); color: #fff; display: none; align-items: center; justify-content: center;
}
.check svg { width: 14px; height: 14px; }
[aria-pressed="true"] > .check { display: flex; }

/* Segment-Schalter */
.seg { display: flex; background: var(--seg); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button {
  flex: 1; min-width: 0; min-height: 44px; padding: 6px 8px; border: 1px solid transparent; background: none; border-radius: 8px;
  font-size: 15px; font-weight: 500; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; line-height: 1.2;
}
.seg button svg { width: 18px; height: 18px; flex: 0 0 auto; }
.seg button[aria-pressed="true"] { background: var(--card); border-color: var(--line); color: var(--text); font-weight: 600; }
.seg button[aria-pressed="true"].accent { border-color: var(--accent); }

/* Maße */
.dim { margin-bottom: 20px; }
.dim-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.dim-row label { font-weight: 600; }
.num { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.num input {
  width: 96px; height: 44px; padding: 0 10px; text-align: right; border: 1px solid var(--field); border-radius: 10px;
  background: var(--card); font-variant-numeric: tabular-nums; font-size: 17px; -moz-appearance: textfield;
}
.num input::-webkit-outer-spin-button, .num input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.dim-minmax { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: -4px; }
.dim-msg { margin: 6px 0 0; font-size: 15px; color: var(--error); }
.area { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.area strong { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.hint { margin-top: 16px; padding: 16px; background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; font-size: 15px; }
.hint p { margin: 0 0 8px; }
.hint p:last-child { margin-bottom: 0; }

/* Range-Slider */
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; margin: 0; background: transparent; --p: 50%; touch-action: pan-y; }
input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--accent) 0 var(--p), var(--line) var(--p) 100%); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -12px; border-radius: 50%; background: #fff; border: 2px solid var(--accent); }
input[type="range"]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
input[type="range"]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
input[type="range"]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 2px solid var(--accent); }
input[type="range"]:focus-visible { outline-offset: 0; }

/* Modelle */
.type-desc { margin: 12px 0 16px; font-size: 15px; color: var(--muted); }
.models { display: flex; flex-direction: column; gap: 12px; }
.model-card {
  position: relative; display: block; width: 100%; text-align: left; padding: 16px 16px 14px; background: var(--card);
  border: 1px solid var(--line); border-radius: var(--radius); transition: border-color .2s, background .2s;
}
.model-card:hover { border-color: #C9C3BA; }
.mc-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-right: 32px; }
.mc-brand { font-size: 13px; color: var(--muted); font-weight: 500; letter-spacing: .02em; }
.badge { font-size: 12px; font-weight: 600; color: var(--accent-ink); background: var(--accent); padding: 3px 8px; border-radius: 10px; }
.mc-name { font-size: 19px; font-weight: 600; margin: 4px 0 2px; }
.mc-benefit { font-size: 15px; color: var(--muted); }
.mc-foot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 10px; font-size: 15px; }
.mc-price { font-weight: 600; font-variant-numeric: tabular-nums; }
.mc-fit { color: var(--muted); font-size: 13px; }

/* Farben */
.chips { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.chip { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 0; border: 0; background: none; font-size: 13px; line-height: 1.25; text-align: center; color: var(--text); }
.chip .sw {
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(0,0,0,.12);
  box-shadow: 0 0 0 3px var(--bg), 0 0 0 4px transparent; transition: box-shadow .2s;
  display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--text); background: #fff;
}
.chip[aria-pressed="true"] .sw { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent); }
.chip small { color: var(--muted); font-size: 12px; }
.chip:disabled { opacity: .4; cursor: not-allowed; }
.field-inline { margin-top: 16px; }

/* Seiten */
.side-row { padding: 14px 0; border-bottom: 1px solid var(--line); }
.side-row:first-of-type { border-top: 1px solid var(--line); }
.side-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.side-head strong { font-weight: 600; }
.side-head span { color: var(--muted); font-size: 15px; }
.side-head .side-price { margin-left: auto; color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
.side-row.hl .side-head strong { color: var(--accent); }
.explain { margin: 20px 0 0; font-size: 15px; color: var(--muted); }
.explain p { margin: 0 0 8px; }
.explain b { color: var(--text); font-weight: 600; }

/* Optionen */
.opt-row { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.opt-row:first-of-type { border-top: 1px solid var(--line); }
.opt-text { flex: 1; min-width: 0; }
.opt-text strong { display: block; font-weight: 600; }
.opt-text > span { display: block; font-size: 15px; color: var(--muted); }
.opt-text em { display: block; font-style: normal; font-size: 13px; color: var(--muted); margin-top: 2px; }
.opt-price { font-size: 15px; color: var(--text); white-space: nowrap; font-variant-numeric: tabular-nums; }
.opt-row.disabled .opt-text strong, .opt-row.disabled .opt-price { color: var(--muted); }
.switch { flex: 0 0 auto; position: relative; width: 51px; height: 31px; border-radius: 16px; border: 0; padding: 0; background: #C7C2BA; transition: background .2s; }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.switch:disabled { opacity: .45; cursor: not-allowed; }
.switch-hit { position: relative; display: flex; align-items: center; justify-content: center; min-width: 51px; min-height: 44px; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--field); background: var(--card); display: flex; align-items: center; justify-content: center; }
.stepper button:disabled { opacity: .35; cursor: not-allowed; }
.stepper svg { width: 18px; height: 18px; }
.stepper output { min-width: 24px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }

/* Zusammenfassung */
.summary { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 16px; }
.sum-row { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line); }
.sum-row:last-child { border-bottom: 0; }
.sum-row dt { flex: 0 0 34%; font-size: 15px; color: var(--muted); }
.sum-row dd { flex: 1; margin: 0; font-size: 15px; font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.sum-row .edit { flex: 0 0 auto; margin: -10px -8px -10px 0; min-height: 44px; padding: 0 8px; border: 0; background: none; color: var(--accent); font-size: 15px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

function sunTimes(dateStr, site) {

   ===================================================================== */
const SIDES_WALL = ['left', 'front', 'right'];
const SIDES_FREE = ['front', 'right', 'back', 'left'];
const activeSides = (s) => (s.mount === 'wall' ? SIDES_WALL : SIDES_FREE);
const sideLengthCm = (s, side) => (side === 'front' || side === 'back' ? s.width : s.depth);
const limitConfigs = (model, mount) => MODELS[model].limits[mount];
/* Erlaubter Bereich je Maß – abhängig vom jeweils anderen Maß (ohne w/d: Gesamthülle aller Ausführungen) */
function limitsFor(model, mount, w, d) {
  const cs = limitConfigs(model, mount);
  const pick = (dim, other, val) => {
    const ok = val == null ? cs : cs.filter(c => val >= c[other][0] && val <= c[other][1]);
    const list = ok.length ? ok : cs;
    return [Math.min(...list.map(c => c[dim][0])), Math.max(...list.map(c => c[dim][1]))];
  };
  return { w: pick('w', 'd', d), d: pick('d', 'w', w) };
}
const fitsModel = (model, mount, w, d) => limitConfigs(model, mount).some(c => w >= c.w[0] && w <= c.w[1] && d >= c.d[0] && d <= c.d[1]);
/* Nächstgelegene zulässige Größe (kleinste Änderung; prefer = 'w'|'d' hält dieses Maß möglichst fest) */
function fitLimits(model, mount, w, d, prefer) {
  let best = null;
  for (const c of limitConfigs(model, mount)) {
    const nw = clamp(w, c.w[0], c.w[1]), nd = clamp(d, c.d[0], c.d[1]);
    const cost = Math.abs(nw - w) * (prefer === 'w' ? 10 : 1) + Math.abs(nd - d) * (prefer === 'd' ? 10 : 1);
    if (!best || cost < best.cost) best = { w: nw, d: nd, cost };
  }
  return best;
}
/* Pfostenplan: Mittelpfosten vorne (und hinten) ab midW, seitliches Pfostenpaar ab midD */
function postPlan(s) {
  const M = MODELS[s.model];
  const midW = s.width > M.midW;
  const midD = s.depth > (typeof M.midD === 'object' ? M.midD[s.mount] : M.midD);
  const front = midW ? 3 : 2;
  return { midW, midD, count: (s.mount === 'free' ? front * 2 : front) + (midD ? 2 : 0) };
}

/* Hält Zustand konsistent (Grenzen, Abhängigkeiten). Gibt Hinweise für den Toast zurück. */
function normalize(s) {
  const msgs = [];
  if (!MODELS[s.model]) s.model = 'varia';
  const M = MODELS[s.model];
  s.roofType = M.type;
  s.azimuth = Number.isFinite(+s.azimuth) ? ((Math.round(+s.azimuth) % 360) + 360) % 360 : 180;
  const f = fitLimits(s.model, s.mount, Math.round(s.width) || 0, Math.round(s.depth) || 0);
  const w = f.w, d = f.d;
  if (w !== s.width || d !== s.depth) {
    s.width = w; s.depth = d;
    msgs.push(t('toast.clamped', { w: fmtM(w), d: fmtM(d), model: modelLabel(s.model) }));
  }
  if (s.options.solar && !M.solar) { s.options.solar = false; msgs.push(t('toast.solarRemoved')); }
  if (s.options.lightband && !(M.lightband && s.mount === 'wall')) { s.options.lightband = false; msgs.push(t('toast.lightbandRemoved')); }
  s.options.heaters = clamp(s.options.heaters | 0, 0, 4);
  if (M.type === 'retract' && s.colorRoof === 'custom') s.colorRoof = 'ral7016';
  if (s.colorFrame !== 'custom' && s.colorRoof !== 'custom') s.customRal = '';
  if (M.type !== 'bio') s.view.louver = 0; else s.view.louver = Math.min(s.view.louver, M.louverMax);
  return msgs;
}

function setState(patch = {}, opts = {}) {
  for (const k of Object.keys(patch)) {
    const v = patch[k];
    state[k] = v && typeof v === 'object' && !Array.isArray(v) && state[k] && typeof state[k] === 'object' ? { ...state[k], ...v } : v;
  }
  const msgs = normalize(state);
  if (msgs.length && !opts.quiet) UI.toast(msgs.join(' '));
  render();
}

}

/* =====================================================================
   4. PRICING
   P = base + Fläche·perM2 (+ Sonderfarbe %) + freistehend + Seiten·Länge + Optionen + Montage
   Anzeige: [P·rangeLow ; P·rangeHigh], kaufmännisch gerundet auf roundTo
   ===================================================================== */
const roundTo = (x, step) => Math.round(x / step) * step;

/* Einzelpreise (auch für die Anzeige in den Schritten) */
const areaM2 = (s) => s.width * s.depth / 10000;
const sideCost = (s, side, P = PRICES) => {
  const lenM = sideLengthCm(s, side) / 100;
  if (s.sides[side] === 'zip') return (P.zipEach || 0) + lenM * P.zipPerM;
  if (s.sides[side] === 'glass') return lenM * P.glassPerM;
  return 0;
};
const ledPrice = (s, P = PRICES) => (areaM2(s) > (P.ledLargeFromM2 ?? Infinity) ? (P.ledLarge ?? P.led) : P.led);
const solarPrice = (s, P = PRICES) => P.solar + areaM2(s) * (P.solarPerM2 || 0);

function calcPrice(s, P = PRICES) {
  const m = P.models[s.model];
  const M = MODELS[s.model];
  const items = [];
  const area = (s.width * s.depth * m.perM2) / 10000;     // in cm² gerechnet → keine Rundungsfehler
  items.push(['base', m.base], ['area', area]);
  if (s.colorFrame === 'custom' || s.colorRoof === 'custom') items.push(['customColor', Math.max((m.base + area) * P.customColorPct, P.customColorMin || 0)]);
  if (s.mount === 'free') items.push(['freestanding', P.freestanding]);
  for (const side of activeSides(s)) {
    const c = sideCost(s, side, P);
    if (c) items.push([s.sides[side] + '_' + side, c]);
  }
  const o = s.options;
  if (o.led) items.push(['led', ledPrice(s, P)]);
  if (o.heaters > 0) items.push(['heaters', o.heaters * P.heaterEach]);
  if (o.sensor) items.push(['sensor', P.sensor]);
  if (o.smarthome) items.push(['smarthome', P.smarthome]);
  if (o.solar && M.solar) items.push(['solar', solarPrice(s, P)]);
  if (o.lightband && M.lightband && s.mount === 'wall') items.push(['lightband', (s.width / 100) * P.lightbandPerM]);
  items.push(['install', P.install + areaM2(s) * (P.installPerM2 || 0)]);
  const total = Math.round(items.reduce((a, [, v]) => a + v, 0));
  return {
    P: total,
    low: roundTo(total * P.rangeLow, P.roundTo),
    high: roundTo(total * P.rangeHigh, P.roundTo),
    breakdown: items.map(([item, amount]) => ({ item, amount: Math.round(amount) }))
  };
}
/* „ab“-Preis eines Modells: kleinste Größe, Wandanbau, ohne Optionen */
function fromPrice(model) {
  const c = limitConfigs(model, 'wall')[0];
  const s = { ...defaultState(), model, width: c.w[0], depth: c.d[0] };
  return calcPrice(s).low;
}
function priceText(low, high) { return `${t('price.prefix')} ${fmtInt(low)} – ${fmtInt(high)} €`; }
/* Blur-Modus: Preise erst nach der Anfrage sichtbar. Im DOM stehen nur Platzhalterziffern, nie der echte Wert. */
const priceLocked = () => PRICE_MODE === 'blur' && !state.unlocked;
const fakeDigits = (str) => str.replace(/\d/g, '8');
function moneyHTML(n) {
  if (!priceLocked()) return esc(fmtEur(n));
  return `<span class="blur" aria-hidden="true">${esc(fakeDigits(fmtEur(n)))}</span><span class="sr-only">${esc(t('price.hiddenSr'))}</span>`;
}
function rangeHTML(low, high) {
  if (!priceLocked()) return esc(priceText(low, high));
  return `${esc(t('price.prefix'))} <span class="blur" aria-hidden="true">${esc(fakeDigits(`${fmtInt(low)} – ${fmtInt(high)}`))}</span> €<span class="sr-only">${esc(t('price.hiddenSr'))}</span>`;
}
/* i18n-Text mit {price}-Platzhalter, Preis ggf. unscharf */
function tMoney(key, n) { return esc(t(key, { price: '\u0001' })).replace('\u0001', moneyHTML(n)); }

/* Selbsttest: Kontrollbeispiel muss exakt stimmen */
function selfTest() {
  const s = { ...defaultState(), lang: 'de', model: 'varia', mount: 'wall', width: 400, depth: 300,
    sides: { left: 'zip', right: 'zip', front: 'open', back: 'open' },
    options: { led: true, heaters: 0, sensor: true, smarthome: false, solar: false, lightband: false } };
  const r = calcPrice(s, REFERENCE_PRICES);              // Formel gegen das Briefing prüfen
  const prevLang = state.lang; state.lang = 'de';
  const txt = priceText(r.low, r.high);
  const cur = calcPrice(s);                              // dieselbe Konfiguration mit aktuellen Preisen
  const curTxt = priceText(cur.low, cur.high);
  state.lang = prevLang;
  const ok = r.P === 25650 && txt === 'ca. 23.500 – 28.000 €';
  window.__CG_SELFTEST__ = { ok, P: r.P, text: txt, currentPrices: { P: cur.P, text: curTxt } };
  if (!ok) console.error('[pricing] Selbsttest FEHLGESCHLAGEN', r, txt);
  else if (DEBUG) console.info('[pricing] Selbsttest ok:', r.P, txt);
  return ok;
}

   ===================================================================== */
const SIDE_CODE = { open: 'o', zip: 'z', glass: 'g' };
const SIDE_DECODE = { o: 'open', z: 'zip', g: 'glass' };
const SIDE_KEY = { front: 'f', back: 'b', left: 'l', right: 'r' };
const SIDE_KEY_DECODE = { f: 'front', b: 'back', l: 'left', r: 'right' };

function encodeHash(s) {
  const p = new URLSearchParams();
  if (s.purpose) p.set('p', s.purpose);
  p.set('m', s.mount);
  p.set('az', s.azimuth);
  if (s.site.source !== 'default') { p.set('la', s.site.lat.toFixed(3)); p.set('lo', s.site.lon.toFixed(3)); p.set('c', s.site.country); }
  p.set('w', s.width);
  p.set('d', s.depth);
  p.set('mo', s.model);
  p.set('cf', s.colorFrame);
  p.set('cr', s.colorRoof);
  if (s.customRal) p.set('ral', s.customRal);
  p.set('s', activeSides(s).map(k => SIDE_KEY[k] + SIDE_CODE[s.sides[k]]).join('_'));
  const o = s.options;
  p.set('o', [o.led ? 1 : 0, o.heaters, o.sensor ? 1 : 0, o.smarthome ? 1 : 0, o.solar ? 1 : 0, o.lightband ? 1 : 0].join(''));
  p.set('st', Math.min(s.step, 8));
  return p.toString();
}

function decodeHash(hash) {
  const p = new URLSearchParams(hash.replace(/^#/, ''));
  if (!p.has('mo')) return null;
  const s = {};
  if (RECOMMEND[p.get('p')]) { s.purpose = p.get('p'); s.recommended = RECOMMEND[s.purpose].model; }
  if (['wall', 'free'].includes(p.get('m'))) s.mount = p.get('m');
  if (p.has('az')) s.azimuth = +p.get('az');
  const la = parseFloat(p.get('la')), lo = parseFloat(p.get('lo'));
  if (Math.abs(la) <= 90 && Math.abs(lo) <= 180) s.site = { lat: la, lon: lo, country: TIMEZONES[p.get('c')] ? p.get('c') : 'LU', label: null, source: 'saved' };
  if (MODELS[p.get('mo')]) s.model = p.get('mo');
  const w = parseInt(p.get('w'), 10), d = parseInt(p.get('d'), 10);
  if (w > 0) s.width = w;
  if (d > 0) s.depth = d;
  if (COLORS[p.get('cf')]) s.colorFrame = p.get('cf');
  if (COLORS[p.get('cr')]) s.colorRoof = p.get('cr');
  if (p.get('ral')) s.customRal = p.get('ral').slice(0, 20);
  const sides = { front: 'open', left: 'open', right: 'open', back: 'open' };
  (p.get('s') || '').split('_').forEach(tok => {
    const k = SIDE_KEY_DECODE[tok[0]], v = SIDE_DECODE[tok[1]];
    if (k && v) sides[k] = v;
  });
  s.sides = sides;
  const o = (p.get('o') || '').split('').map(Number);
  s.options = { led: o[0] === 1, heaters: clamp(o[1] || 0, 0, 4), sensor: o[2] === 1, smarthome: o[3] === 1, solar: o[4] === 1, lightband: o[5] === 1 };
  const st = clamp(parseInt(p.get('st'), 10) || 1, 1, 8);
  s.step = st; s.maxStep = st;
  s.mountTouched = st > 2; s.modelTouched = st > 4; s.sidesTouched = st > 6;
  return s;
}

let hashTimer = 0;
function scheduleHash() {
  clearTimeout(hashTimer);
  hashTimer = setTimeout(() => {
    const url = location.pathname + location.search + '#' + encodeHash(state);
    try { history.replaceState(null, '', url); } catch (e) { /* file:// in manchen Browsern */ }
  }, 150);
}
function shareUrl() { return location.href.split('#')[0] + '#' + encodeHash(state); }

function readUtm() {
  const keys = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'gclid', 'fbclid'];
  const u = {};
  keys.forEach(k => { u[k] = QS.get(k) || null; });
  u.referrer = document.referrer || null;
  u.landing = location.href.split('#')[0];
  return u;
}

/* =====================================================================
   6. TRACKING – GA4 (dataLayer), Meta-Pixel, Elternseite (iframe)
   ===================================================================== */
let consentGranted = !TRACKING_REQUIRES_CONSENT || window.CG_CONSENT === true;
const trackedSteps = new Set();

function track(event, params = {}) {
  if (!consentGranted && window.CG_CONSENT !== true) { if (DEBUG) console.info('[track:blockiert]', event, params); return; }
  const payload = { event, ...params };
  (window.dataLayer = window.dataLayer || []).push(payload);
  if (typeof window.fbq === 'function') window.fbq('trackCustom', event, params);
  if (IN_IFRAME) window.parent.postMessage({ type: 'cg-configurator:event', event, params }, '*');
  if (DEBUG) console.info('[track]', payload);
}
function trackParams() {
  const p = calcPrice(state);
  return { model: state.model, price_low: p.low, price_high: p.high, value: p.P, currency: 'EUR',
    purpose: state.purpose || 'none', mount: state.mount, lang: state.lang };
}
function trackStep(n) {
  if (trackedSteps.has(n)) return;
  trackedSteps.add(n);
  track('config_step_' + n, { step: n, ...trackParams() });
}

/* =====================================================================
   7. SCENE – Three.js, komplett prozedural (1 Einheit = 1 m)
   Hauswand bei z = 0, Pergola wächst nach +z, Breite entlang x
   ===================================================================== */
const Scene3D = (() => {
  let T, OrbitControls, RoomEnvironment;
  let renderer, scene, camera, controls, host;
  let ready = false, rafId = 0, dirty = true, lastT = 0, running = false, pageVisible = true, inView = true;
  let structSig = '', lastState = null, step = 1;
  let lastInteract = performance.now(), camTween = null, idleDir = 1, hasInteracted = false;
  let pickEnabled = false, hoverSide = null, panelSide = null, downPos = null;
  let perf = { frames: 0, acc: 0, degraded: false };
  let refitTimer = 0, wowDone = false;
  const H = 2.4;                                   // lichte Höhe unter dem Träger
  const callbacks = { onSidePick: null, onLouver: null, onInteract: null };
  const mats = {};
  const envMats = [];
  const tex = {};
  const refs = { sides: {}, louvers: null, fabric: null, ledStrips: null, heaters: [], dims: null, labels: {} };
  let sunMode = false, pathSig = '', pathR = 6, sceneTexts = {};
  const anim = { louver: 0, extend: 1, time: 15, date: '2026-06-21',
    sides: { front: { zip: 0, glass: 0 }, left: { zip: 0, glass: 0 }, right: { zip: 0, glass: 0 }, back: { zip: 0, glass: 0 } } };
  const sideTarget = {};
  const tweens = new Map();
  const lights = {};
  let groups = {};
  let labelsText = { front: '', left: '', right: '', back: '' };

  /* ---------- Tweens ---------- */
  const ease = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
  function tween(key, from, to, ms, onUpdate, onDone) {
    if (reducedMotion.matches || ms <= 0 || from === to) {
      tweens.delete(key); onUpdate(to); onDone && onDone(); dirty = true; return;
    }
    tweens.set(key, { t0: performance.now(), from, to, ms, onUpdate, onDone });
    dirty = true;
  }
  function stepTweens(now) {
    if (!tweens.size) return false;
    for (const [key, tw] of tweens) {
      const k = clamp((now - tw.t0) / tw.ms, 0, 1);
      tw.onUpdate(tw.from + (tw.to - tw.from) * ease(k));
      if (k >= 1) { tweens.delete(key); tw.onDone && tw.onDone(); }
    }
    return true;
  }

  /* ---------- Texturen (Canvas, prozedural) ---------- */
  function canvasTex(w, h, draw, repeat = true) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const tx = new T.CanvasTexture(c);
    tx.colorSpace = T.SRGBColorSpace;
    if (repeat) { tx.wrapS = tx.wrapT = T.RepeatWrapping; }
    tx.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    return tx;
  }
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  function makeTextures() {
    // Helle Holzdielen: 8 Dielen à 14,5 cm, Kachel 1,16 × 2,32 m
    tex.planks = canvasTex(512, 1024, (g, w, h) => {
      const n = 8, pw = w / n;
      for (let i = 0; i < n; i++) {
        const l = 70 + rnd() * 6;
        g.fillStyle = `hsl(32, 26%, ${l}%)`; g.fillRect(i * pw, 0, pw, h);
        for (let k = 0; k < 26; k++) {
          g.strokeStyle = `rgba(110, 80, 50, ${0.04 + rnd() * 0.06})`; g.lineWidth = 1 + rnd();
          const x = i * pw + rnd() * pw; g.beginPath(); g.moveTo(x, 0);
          g.bezierCurveTo(x + rnd() * 6 - 3, h * 0.33, x + rnd() * 6 - 3, h * 0.66, x + rnd() * 4 - 2, h); g.stroke();
        }
        const j = rnd() * h;
        g.fillStyle = 'rgba(70, 50, 30, .45)'; g.fillRect(i * pw, j, pw, 3);
        g.fillStyle = 'rgba(70, 50, 30, .55)'; g.fillRect(i * pw, 0, 3, h);
      }
    });
    tex.plaster = canvasTex(256, 256, (g, w, h) => {
      g.fillStyle = '#ECE7DF'; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 2600; i++) {
        g.fillStyle = rnd() > 0.5 ? 'rgba(255,255,255,.35)' : 'rgba(120,105,85,.08)';
        g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2, 1 + rnd() * 2);
      }
    });
    tex.grass = canvasTex(256, 256, (g, w, h) => {
      g.fillStyle = '#76914F'; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 5000; i++) {
        const l = 26 + rnd() * 18;
        g.fillStyle = `hsla(${80 + rnd() * 20}, 38%, ${l}%, .5)`;
        g.fillRect(rnd() * w, rnd() * h, 1, 2 + rnd() * 3);
      }
    });
    tex.solar = canvasTex(64, 64, (g, w, h) => {
      g.fillStyle = '#18233A'; g.fillRect(0, 0, w, h);
      g.strokeStyle = '#5F7393'; g.lineWidth = 2; g.strokeRect(1, 1, w - 2, h - 2);
      g.strokeStyle = 'rgba(160,180,210,.35)'; g.lineWidth = 1;
      g.beginPath(); g.moveTo(w / 2, 0); g.lineTo(w / 2, h); g.moveTo(0, h / 2); g.lineTo(w, h / 2); g.stroke();
    });
    tex.zip = canvasTex(64, 64, (g, w, h) => {
      g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
      g.fillStyle = '#d0d0d0';
      for (let y = 0; y < h; y += 4) for (let x = (y / 4) % 2 ? 2 : 0; x < w; x += 4) g.fillRect(x, y, 2, 2);
    });
  }

  /* ---------- Materialien (geteilt, Farben ändern sich ohne Neubau) ---------- */
  function std(params) { const m = new T.MeshStandardMaterial(params); m.userData.envBase = m.envMapIntensity; envMats.push(m); return m; }
  function makeMaterials() {
    mats.frame = std({ color: COLORS.ral7016.hex, roughness: 0.55, metalness: 0.35 });
    mats.roof = std({ color: COLORS.ral7016.hex, roughness: 0.5, metalness: 0.35 });
    mats.fabric = std({ color: COLORS.ral7016.hex, roughness: 0.9, metalness: 0, side: T.DoubleSide });
    mats.solar = std({ color: '#ffffff', map: tex.solar, roughness: 0.25, metalness: 0.6 });
    mats.glass = new T.MeshPhysicalMaterial({ color: '#ffffff', roughness: 0.04, metalness: 0, transparent: true, opacity: 0.2,
      side: T.DoubleSide, depthWrite: false, envMapIntensity: 1.6, clearcoat: 1 });
    mats.glass.userData.envBase = 1.6; envMats.push(mats.glass);
    mats.zip = std({ color: '#47494C', roughness: 0.95, transparent: true, opacity: 0.86, side: T.DoubleSide, alphaMap: tex.zip });
    mats.led = std({ color: '#FFF4E0', emissive: '#FFC27A', emissiveIntensity: 0.3, roughness: 0.4 });
    mats.heaterBody = std({ color: '#2A2C2F', roughness: 0.4, metalness: 0.6 });
    mats.heaterGlow = std({ color: '#5A2A10', emissive: '#FF6A1A', emissiveIntensity: 0.25, roughness: 0.5 });
    mats.terrace = std({ map: tex.planks, roughness: 0.82, metalness: 0 });
    mats.lawn = std({ map: tex.grass, roughness: 1, metalness: 0 });
    mats.plaster = std({ map: tex.plaster, roughness: 0.95, metalness: 0 });
    mats.plinth = std({ color: '#B8B1A6', roughness: 0.9 });
    mats.coping = std({ color: '#4A4D51', roughness: 0.6, metalness: 0.3 });
    mats.doorFrame = std({ color: '#2F3236', roughness: 0.45, metalness: 0.5 });
    mats.doorGlass = std({ color: '#2B3640', roughness: 0.05, metalness: 0.2, emissive: '#E89A55', emissiveIntensity: 0, envMapIntensity: 1.4 });
    mats.doorGlass.userData.envBase = 1.4;
    mats.sofa = std({ color: '#D9D2C7', roughness: 0.95 });
    mats.cushion = std({ color: '#B9AE9E', roughness: 0.95 });
    mats.wood = std({ color: '#6E5038', roughness: 0.7 });
    mats.potMat = std({ color: '#3A3D41', roughness: 0.7 });
    mats.leaf = std({ color: '#5E7F45', roughness: 0.9, flatShading: true });
    mats.spa = std({ color: '#E8E4DE', roughness: 0.6 });
    mats.water = std({ color: '#3FA6B8', roughness: 0.08, metalness: 0.1, emissive: '#2BB3D6', emissiveIntensity: 0 });
    mats.dim = new T.MeshBasicMaterial({ color: '#2B2D30', depthTest: false, transparent: true, opacity: 0.85 });
    mats.hit = new T.MeshBasicMaterial({ colorWrite: false, depthWrite: false, side: T.DoubleSide });
    mats.highlight = new T.MeshBasicMaterial({ color: getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#7B5B3A',
      transparent: true, opacity: 0.18, depthWrite: false, side: T.DoubleSide });
  }

  /* ---------- Himmel, Licht, Boden ---------- */
  const SKY = { day: { top: 0x8DB6D8, horizon: 0xE9EEF0 }, night: { top: 0x0A1222, horizon: 0x2A3346 } };
  const hexToVec = (h) => new T.Vector3(((h >> 16) & 255) / 255, ((h >> 8) & 255) / 255, (h & 255) / 255);
  function makeEnvironment() {
    const skyMat = new T.ShaderMaterial({
      side: T.BackSide, depthWrite: false, fog: false,
      uniforms: { top: { value: hexToVec(SKY.day.top) }, horizon: { value: hexToVec(SKY.day.horizon) } },
      vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
      fragmentShader: 'uniform vec3 top; uniform vec3 horizon; varying vec3 vP; void main(){ float h = clamp(vP.y, 0.0, 1.0); gl_FragColor = vec4(mix(horizon, top, pow(h, 0.55)), 1.0); }'
    });
    groups.sky = new T.Mesh(new T.SphereGeometry(90, 32, 16), skyMat);
    scene.add(groups.sky);
    scene.fog = new T.Fog(SKY.day.horizon, 28, 80);

    lights.hemi = new T.HemisphereLight(0xE4ECF2, 0x7A6C58, 0.7);
    scene.add(lights.hemi);
    lights.sun = new T.DirectionalLight(0xFFF1DC, 2.6);
    lights.sun.castShadow = true;
    lights.sun.shadow.mapSize.set(1024, 1024);
    lights.sun.shadow.bias = -0.0004;
    lights.sun.shadow.normalBias = 0.03;
    scene.add(lights.sun, lights.sun.target);
    // Konstante Lichteranzahl (keine Shader-Neukompilierung beim Umschalten)
    lights.led1 = new T.PointLight(0xFFC98A, 0, 7, 2);
    lights.led2 = new T.PointLight(0xFFC98A, 0, 7, 2);
    lights.heat = new T.PointLight(0xFF7A2A, 0, 6, 2);
    scene.add(lights.led1, lights.led2, lights.heat);

    const lawn = new T.Mesh(new T.CircleGeometry(70, 48), mats.lawn);
    lawn.rotation.x = -Math.PI / 2; lawn.position.y = -0.062; lawn.receiveShadow = true;
    tex.grass.repeat.set(36, 36);
    scene.add(lawn);
  }

  /* ---------- Bau-Helfer ---------- */
  function box(w, h, d, mat, x = 0, y = 0, z = 0, cast = true, receive = false) {
    const m = new T.Mesh(new T.BoxGeometry(w, h, d), mat);
    m.position.set(x, y, z); m.castShadow = cast; m.receiveShadow = receive;
    return m;
  }
  function disposeTree(obj) {
    if (!obj) return;
    obj.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.userData.ownMaterial && o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); }
    });
    obj.parent && obj.parent.remove(obj);
  }
  function label(text, scale = 1) {
    const c = document.createElement('canvas'); c.width = 512; c.height = 144;
    const g = c.getContext('2d');
    g.font = `600 64px ${getComputedStyle(document.body).fontFamily}`;
    const tw = Math.min(480, g.measureText(text).width + 64);
    const x0 = (512 - tw) / 2;
    g.fillStyle = 'rgba(255,255,255,.94)';
    g.beginPath(); g.roundRect ? g.roundRect(x0, 20, tw, 104, 52) : g.rect(x0, 20, tw, 104); g.fill();
    g.fillStyle = '#2B2D30'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 256, 74);
    const tx = new T.CanvasTexture(c); tx.colorSpace = T.SRGBColorSpace;
    const sp = new T.Sprite(new T.SpriteMaterial({ map: tx, depthTest: false, transparent: true }));
    sp.userData.ownMaterial = true; sp.renderOrder = 10;
    sp.scale.set(1.1 * scale, 0.31 * scale, 1);
    return sp;
  }

  /* ---------- Szene je Konfiguration ---------- */
  function postPositions(s, M, W, D) {
    const pw = M.post, plan = postPlan(s), xs = [-W / 2 + pw / 2, W / 2 - pw / 2];
    if (plan.midW) xs.splice(1, 0, 0);
    const pos = xs.map(x => ({ x, z: D - pw / 2, back: false }));
    if (s.mount === 'free') xs.forEach(x => pos.push({ x, z: pw / 2, back: true }));
    if (plan.midD) [-W / 2 + pw / 2, W / 2 - pw / 2].forEach(x => pos.push({ x, z: D / 2, mid: true }));
    return pos;
  }

  function build(s) {
    ['pergola', 'terrace', 'house', 'furniture', 'dims'].forEach(k => { disposeTree(groups[k]); groups[k] = null; });
    refs.sides = {}; refs.louvers = null; refs.fabric = null; refs.heaters = []; refs.labels = {};
    const M = MODELS[s.model];
    const W = s.width / 100, D = s.depth / 100, pw = M.post, fh = M.beam;
    const wall = s.mount === 'wall';
    const wallOff = 0.12;
    const isGlass = M.type === 'glass';
    const rise = isGlass ? Math.max(0.12, D * Math.tan(T.MathUtils.degToRad(5))) : 0;
    const zIn = wall ? wallOff : pw;                       // Innenkante hinten
    const pg = new T.Group(); groups.pergola = pg; scene.add(pg);

    /* Pfosten */
    postPositions(s, M, W, D).forEach(p => {
      const top = H + fh + (isGlass ? rise * (1 - p.z / D) : 0);
      pg.add(box(pw, top, pw, mats.frame, p.x, top / 2, p.z));
    });

    /* Rahmen */
    if (!isGlass) {
      pg.add(box(W, fh, pw, mats.frame, 0, H + fh / 2, D - pw / 2));                       // vorne
      pg.add(box(W, fh, wall ? wallOff : pw, mats.frame, 0, H + fh / 2, wall ? wallOff / 2 : pw / 2)); // hinten / Wandträger
      [-1, 1].forEach(sx => pg.add(box(pw, fh, D - zIn - pw, mats.frame, sx * (W / 2 - pw / 2), H + fh / 2, (zIn + D - pw) / 2)));
    } else {
      pg.add(box(W, fh, pw, mats.frame, 0, H + fh / 2, D - pw / 2));                       // Rinne vorne
      pg.add(box(W, fh, wall ? wallOff : pw, mats.frame, 0, H + rise + fh / 2, wall ? wallOff / 2 : pw / 2));
    }

    /* Dach */
    if (M.type === 'bio') buildLouvers(s, M, pg, W, D, zIn, pw, fh);
    if (M.type === 'glass') buildGlassRoof(s, M, pg, W, D, pw, fh, rise);
    if (M.type === 'retract') buildFabricRoof(s, M, pg, W, D, zIn, pw, fh);

    /* LED-Leisten (unter den Innenkanten) */
    const led = new T.Group(); refs.ledStrips = led; pg.add(led);
    led.add(box(W - 2 * pw, 0.016, 0.03, mats.led, 0, H - 0.01, D - pw - 0.03, false));
    led.add(box(W - 2 * pw, 0.016, 0.03, mats.led, 0, H + rise - 0.01, zIn + 0.03, false));
    [-1, 1].forEach(sx => {
      const len = Math.hypot(D - zIn - pw, rise);
      const strip = box(0.03, 0.016, len, mats.led, sx * (W / 2 - pw - 0.03), H + rise / 2 - 0.01, (zIn + D - pw) / 2, false);
      strip.rotation.x = Math.atan2(rise, D - zIn - pw);
      led.add(strip);
    });
    lights.led1.position.set(-W / 4, H - 0.25, D * 0.55);
    lights.led2.position.set(W / 4, H - 0.25, D * 0.55);

    /* Heizstrahler */
    const hp = [
      { x: -W / 4, z: D - pw - 0.14, r: 0.55, y: H - 0.06 }, { x: W / 4, z: D - pw - 0.14, r: 0.55, y: H - 0.06 },
      { x: -W / 4, z: zIn + 0.14, r: -0.55, y: H + rise - 0.06 }, { x: W / 4, z: zIn + 0.14, r: -0.55, y: H + rise - 0.06 }
    ];
    const order = [[], [{ ...hp[0], x: 0 }], [hp[0], hp[1]], [hp[0], hp[1], { ...hp[2], x: 0 }], hp];
    for (let n = 1; n <= 4; n++) {
      const set = new T.Group(); set.visible = false;
      order[n].forEach(p => {
        const g = new T.Group(); g.position.set(p.x, p.y, p.z); g.rotation.x = p.r;
        g.add(box(0.62, 0.07, 0.12, mats.heaterBody, 0, 0, 0, false));
        g.add(box(0.52, 0.018, 0.05, mats.heaterGlow, 0, -0.04, 0, false));
        set.add(g);
      });
      refs.heaters[n] = set; pg.add(set);
    }
    lights.heat.position.set(0, H - 0.5, D / 2);

    /* Seiten */
    activeSides(s).forEach(k => buildSide(s, M, pg, k, W, D, zIn, pw));

    /* Terrasse */
    const tw = W + 2.4, td = wall ? D + 1.6 : D + 2.4;
    const tz = wall ? td / 2 : D / 2;
    const terrace = box(tw, 0.06, td, mats.terrace, 0, -0.03, tz, false, true);
    tex.planks.repeat.set(tw / 1.16, td / 2.32);
    groups.terrace = terrace; scene.add(terrace);

    /* Haus */
    if (wall) {
      const house = new T.Group(); groups.house = house; scene.add(house);
      const hw = Math.max(12, W + 6);
      house.add(box(hw, 4.6, 0.36, mats.plaster, 0, 2.3 - 0.06, -0.18, true, true));
      tex.plaster.repeat.set(hw / 2.5, 2);
      house.add(box(hw, 0.3, 0.38, mats.plinth, 0, 0.09, -0.17, false, true));
      house.add(box(hw + 0.1, 0.08, 0.46, mats.coping, 0, 4.58, -0.18, false));
      const dw = Math.min(3.2, Math.max(1.6, W - 1.0)), dh = 2.25;
      const door = new T.Group(); door.position.set(0, 0, 0.005); house.add(door);
      door.add(box(dw + 0.12, 0.06, 0.08, mats.doorFrame, 0, dh + 0.03, 0, false));
      [-1, 1].forEach(sx => door.add(box(0.06, dh, 0.08, mats.doorFrame, sx * (dw / 2 + 0.03), dh / 2, 0, false)));
      door.add(box(0.05, dh, 0.07, mats.doorFrame, 0, dh / 2, 0.01, false));
      door.add(box(dw + 0.12, 0.04, 0.08, mats.doorFrame, 0, 0.02, 0, false));
      door.add(box(dw, dh, 0.02, mats.doorGlass, 0, dh / 2, -0.01, false));
      const wx = W / 2 + 1.6;
      if (wx + 0.8 < hw / 2) [-1, 1].forEach(sx => {
        const win = new T.Group(); win.position.set(sx * wx, 1.0, 0.005); house.add(win);
        win.add(box(1.2, 1.3, 0.02, mats.doorGlass, 0, 0.65, -0.01, false));
        win.add(box(1.3, 0.06, 0.08, mats.doorFrame, 0, 1.33, 0, false));
        win.add(box(1.3, 0.06, 0.1, mats.doorFrame, 0, -0.02, 0.02, false));
        [-1, 1].forEach(ex => win.add(box(0.06, 1.3, 0.08, mats.doorFrame, ex * 0.62, 0.65, 0, false)));
      });
    }

    /* Möbel für Maßstab und Atmosphäre */
    const fur = new T.Group(); groups.furniture = fur; scene.add(fur);
    if (s.purpose === 'pool') {
      const sz = Math.min(2.1, W - 0.7, D - 0.6);
      fur.add(box(sz, 0.85, sz, mats.spa, 0, 0.425, D / 2, true, true));
      fur.add(box(sz - 0.24, 0.02, sz - 0.24, mats.water, 0, 0.86, D / 2, false));
    } else {
      const sw = Math.min(2.2, W - 0.9), z0 = Math.max(zIn + 0.55, D * 0.3);
      fur.add(box(sw, 0.42, 0.85, mats.sofa, 0, 0.21, z0, true, true));
      fur.add(box(sw, 0.42, 0.2, mats.sofa, 0, 0.6, z0 - 0.33));
      [-1, 1].forEach(sx => fur.add(box(0.18, 0.62, 0.85, mats.sofa, sx * (sw / 2 - 0.09), 0.31, z0)));
      fur.add(box(sw - 0.4, 0.12, 0.6, mats.cushion, 0, 0.48, z0 + 0.05, false));
      if (D > 2.4) fur.add(box(Math.min(1.1, sw * 0.55), 0.36, 0.6, mats.wood, 0, 0.18, Math.min(z0 + 1.15, D - pw - 0.5)));
    }
    [-1, 1].forEach(sx => {
      const px = sx * (W / 2 + 0.75), pz = wall ? D + 0.6 : D + 0.8;
      const pot = new T.Mesh(new T.CylinderGeometry(0.28, 0.22, 0.6, 20), mats.potMat);
      pot.position.set(px, 0.3, pz); pot.castShadow = true; fur.add(pot);
      const bush = new T.Mesh(new T.IcosahedronGeometry(0.42, 1), mats.leaf);
      bush.position.set(px, 0.85, pz); bush.scale.set(1, 1.15, 1); bush.castShadow = true; fur.add(bush);
    });

    /* Maßketten (Schritt 3) */
    const dims = new T.Group(); groups.dims = dims; scene.add(dims);
    const dz = (wall ? D : D) + 0.55, dx = W / 2 + 0.55;
    dims.add(box(W, 0.012, 0.012, mats.dim, 0, 0.02, dz, false));
    [-1, 1].forEach(e => dims.add(box(0.012, 0.012, 0.28, mats.dim, e * W / 2, 0.02, dz, false)));
    dims.add(box(0.012, 0.012, D, mats.dim, dx, 0.02, D / 2, false));
    [0, D].forEach(z => dims.add(box(0.28, 0.012, 0.012, mats.dim, dx, 0.02, z, false)));
    const sc = 0.75 + Math.max(W, D) * 0.07;
    const lw = label(fmtM(s.width), sc); lw.position.set(0, 0.3, dz); dims.add(lw);
    const ld = label(fmtM(s.depth), sc); ld.position.set(dx, 0.3, D / 2); dims.add(ld);
    dims.children.forEach(c => { c.renderOrder = 10; });
    dims.visible = step === 3;

    /* Schattenkamera eng einpassen */
    const r = Math.max(W, D) / 2 + 4;
    const sc2 = lights.sun.shadow.camera;
    sc2.left = -r; sc2.right = r; sc2.top = r; sc2.bottom = -r; sc2.near = 0.5; sc2.far = 40; sc2.updateProjectionMatrix();

    /* Zustand ohne Animation wieder anwenden */
    setLouverMatrices(anim.louver);
    if (refs.fabric) updateFabric(anim.extend);
    Object.keys(refs.sides).forEach(applySideProgress);
    pathSig = '';
    buildSunPath();
    applyHighlight();
    controls.minAzimuthAngle = wall ? -1.38 : -Infinity;
    controls.maxAzimuthAngle = wall ? 1.38 : Infinity;
  }

  /* Lamellen als InstancedMesh, Drehung um die Längsachse */
  function buildLouvers(s, M, pg, W, D, zIn, pw, fh) {
    let z0 = zIn;
    if (s.options.lightband && M.lightband && s.mount === 'wall') {
      const lb = 0.6;
      pg.add(box(W - 2 * pw, 0.012, lb, mats.glass, 0, H + fh * 0.7, zIn + lb / 2, false));
      pg.add(box(W - 2 * pw, fh * 0.6, 0.06, mats.frame, 0, H + fh / 2, zIn + lb + 0.03));
      z0 = zIn + lb + 0.06;
    }
    // Lamellen parallel zur Front (Standard) oder – bei Breite > LOUVER_SPAN – quer dazu (seitliche Ausführung)
    const alongZ = s.width > LOUVER_SPAN;
    const innerW = W - 2 * pw, innerD = D - pw - z0;
    const pitch = 0.2;
    const len = (alongZ ? innerD : innerW) - 0.02;
    const span = alongZ ? innerW : innerD;
    const n = Math.max(1, Math.floor(span / pitch));
    const off = (span - n * pitch) / 2 + pitch / 2;
    const items = [];
    for (let i = 0; i < n; i++) {
      items.push(alongZ ? { x: -innerW / 2 + off + i * pitch, y: H + fh * 0.55, z: z0 + innerD / 2 }
                        : { x: 0, y: H + fh * 0.55, z: z0 + off + i * pitch });
    }
    const geo = alongZ ? new T.BoxGeometry(0.19, 0.03, len) : new T.BoxGeometry(len, 0.03, 0.19);
    const mesh = new T.InstancedMesh(geo, mats.roof, items.length);
    mesh.castShadow = true; mesh.frustumCulled = false;
    pg.add(mesh);
    let solar = null;
    if (M.solar) {
      if (alongZ) tex.solar.repeat.set(1, len / 0.17); else tex.solar.repeat.set(len / 0.17, 1);
      solar = new T.InstancedMesh(alongZ ? new T.BoxGeometry(0.17, 0.006, len - 0.04) : new T.BoxGeometry(len - 0.04, 0.006, 0.17), mats.solar, items.length);
      solar.frustumCulled = false; solar.visible = !!s.options.solar;
      pg.add(solar);
    }
    refs.louvers = { mesh, solar, items, alongZ };
  }
  let _mat, _mat2, _off, _q, _p, _sc, _e;
  function setLouverMatrices(deg) {
    const L = refs.louvers; if (!L) return;
    if (!_mat) { _mat = new T.Matrix4(); _mat2 = new T.Matrix4(); _off = new T.Matrix4().makeTranslation(0, 0.018, 0); _q = new T.Quaternion(); _p = new T.Vector3(); _sc = new T.Vector3(1, 1, 1); _e = new T.Euler(); }
    const r = T.MathUtils.degToRad(deg);
    if (L.alongZ) _e.set(0, 0, r); else _e.set(-r, 0, 0);
    _q.setFromEuler(_e);
    L.items.forEach((it, i) => {
      _p.set(it.x, it.y, it.z); _mat.compose(_p, _q, _sc);
      L.mesh.setMatrixAt(i, _mat);
      if (L.solar) { _mat2.copy(_mat).multiply(_off); L.solar.setMatrixAt(i, _mat2); }
    });
    L.mesh.instanceMatrix.needsUpdate = true;
    if (L.solar) L.solar.instanceMatrix.needsUpdate = true;
    dirty = true;
  }

  /* Glasdach: geneigt (5°), Sparren + Glasfelder */
  function buildGlassRoof(s, M, pg, W, D, pw, fh, rise) {
    const run = D - pw;
    const theta = Math.atan2(rise, run);
    const L = Math.hypot(run, rise);
    const sg = new T.Group();
    sg.position.set(0, H + fh, D - pw / 2);
    sg.rotation.x = theta;
    pg.add(sg);
    [-1, 1].forEach(sx => sg.add(box(pw, fh, L, mats.frame, sx * (W / 2 - pw / 2), -fh / 2, -L / 2)));
    const innerW = W - 2 * pw;
    const bays = Math.max(2, Math.round(innerW / 0.9));
    const bw = innerW / bays;
    for (let i = 1; i < bays; i++) sg.add(box(0.06, 0.1, L, mats.roof, -innerW / 2 + i * bw, -0.05, -L / 2));
    for (let i = 0; i < bays; i++) {
      const g = box(bw - 0.03, 0.012, L - 0.04, mats.glass, -innerW / 2 + (i + 0.5) * bw, 0.008, -L / 2, false);
      g.renderOrder = 2; sg.add(g);
    }
    // Abdeckleisten auf den Sparren
    for (let i = 0; i <= bays; i++) sg.add(box(0.05, 0.02, L, mats.roof, -innerW / 2 + i * bw, 0.022, -L / 2, false));
  }

  /* Tuch-/PVC-Dach auf Schienen, ausfahrbar */
  function buildFabricRoof(s, M, pg, W, D, zIn, pw, fh) {
    const innerW = W - 2 * pw - 0.02;
    const z0 = zIn + 0.02, Lz = D - pw - z0 - 0.02;
    const bays = Math.max(3, Math.round(Lz / 0.5));
    const rows = bays * 4 + 1;
    const geo = new T.BufferGeometry();
    const pos = new Float32Array(rows * 2 * 3), uv = new Float32Array(rows * 2 * 2), idx = [];
    for (let r = 0; r < rows; r++) {
      uv.set([0, r / (rows - 1), 1, r / (rows - 1)], r * 4);
      if (r < rows - 1) { const a = r * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
    }
    geo.setAttribute('position', new T.BufferAttribute(pos, 3));
    geo.setAttribute('uv', new T.BufferAttribute(uv, 2));
    geo.setIndex(idx);
    const mesh = new T.Mesh(geo, mats.fabric); mesh.castShadow = true; mesh.frustumCulled = false;
    pg.add(mesh);
    const profiles = [];
    for (let j = 0; j <= bays; j++) { const p = box(innerW, 0.035, 0.05, mats.frame, 0, H + fh - 0.03, z0); pg.add(p); profiles.push(p); }
    refs.fabric = { geo, rows, bays, innerW, z0, Lz, topY: H + fh - 0.02, profiles, medroom: s.model === 'medroom' };
  }
  function updateFabric(e) {
    const F = refs.fabric; if (!F) return;
    const len = Math.max(0.12, F.Lz * e), bayLen = len / F.bays;
    const sag = (F.medroom ? 0.07 : 0.035) + 0.11 * (1 - e);
    const pos = F.geo.attributes.position.array;
    for (let r = 0; r < F.rows; r++) {
      const bay = Math.min(F.bays, Math.floor(r / 4)), f = r === F.rows - 1 ? 0 : (r % 4) / 4;
      const z = F.z0 + (bay + f) * bayLen;
      const y = F.topY - sag * Math.sin(Math.PI * f);
      pos.set([-F.innerW / 2, y, z, F.innerW / 2, y, z], r * 6);
    }
    F.geo.attributes.position.needsUpdate = true;
    F.geo.computeVertexNormals();
    F.profiles.forEach((p, j) => { p.position.z = F.z0 + j * bayLen; });
    dirty = true;
  }

  /* Seitenelemente: ZIP-Screen, Glas-Schiebewand, Klickfläche, Hervorhebung, Beschriftung */
  function buildSide(s, M, pg, k, W, D, zIn, pw) {
    const spec = {
      front: { x: 0, z: D - pw / 2, rot: 0, L: W - 2 * pw },
      back:  { x: 0, z: pw / 2, rot: Math.PI, L: W - 2 * pw },
      left:  { x: -W / 2 + pw / 2, z: (zIn + D - pw) / 2, rot: -Math.PI / 2, L: D - pw - zIn },
      right: { x: W / 2 - pw / 2, z: (zIn + D - pw) / 2, rot: Math.PI / 2, L: D - pw - zIn }
    }[k];
    const g = new T.Group(); g.position.set(spec.x, 0, spec.z); g.rotation.y = spec.rot; pg.add(g);
    const L = spec.L, top = H - 0.02;

    // ZIP
    const zip = new T.Group(); g.add(zip);
    if (!M.zipIntegrated) zip.add(box(L, 0.12, 0.12, mats.frame, 0, H - 0.06, 0.02));
    const fabH = top - 0.04;
    const fgeo = new T.PlaneGeometry(L - 0.02, fabH); fgeo.translate(0, -fabH / 2, 0);
    const fabric = new T.Mesh(fgeo, mats.zip); fabric.position.y = M.zipIntegrated ? H : H - 0.12; fabric.castShadow = true;
    const fabTop = fabric.position.y;
    tex.zip.repeat.set(L * 6, fabH * 6);
    zip.add(fabric);
    const bar = box(L - 0.01, 0.045, 0.05, mats.frame, 0, fabTop, 0, false); zip.add(bar);

    // Glas
    const glass = new T.Group(); g.add(glass);
    glass.add(box(L, 0.05, 0.11, mats.frame, 0, H - 0.025, 0, false));
    glass.add(box(L, 0.02, 0.11, mats.frame, 0, 0.01, 0, false, true));
    const n = Math.max(2, Math.ceil(L / 1.15));
    const pw2 = L / n + 0.03;
    const ph = H - 0.08;
    const panels = [], finalX = [];
    for (let i = 0; i < n; i++) {
      const p = new T.Group();
      p.add(box(pw2 - 0.05, ph - 0.05, 0.01, mats.glass, 0, ph / 2 + 0.02, 0, false));
      p.add(box(pw2, 0.035, 0.03, mats.frame, 0, ph, 0, false));
      p.add(box(pw2, 0.035, 0.03, mats.frame, 0, 0.04, 0, false));
      [-1, 1].forEach(e => p.add(box(0.03, ph, 0.03, mats.frame, e * (pw2 / 2 - 0.015), ph / 2 + 0.02, 0, false)));
      p.position.z = (i % 2 ? 1 : -1) * 0.025;
      glass.add(p); panels.push(p);
      finalX.push(-L / 2 + pw2 / 2 + i * (L - pw2) / (n - 1));
    }

    // Klickfläche + Hervorhebung + Beschriftung
    const hit = new T.Mesh(new T.PlaneGeometry(L, H), mats.hit); hit.position.y = H / 2; hit.userData.side = k; g.add(hit);
    const hl = new T.Mesh(new T.PlaneGeometry(L, H), mats.highlight); hl.position.y = H / 2; hl.visible = false; hl.renderOrder = 3; g.add(hl);
    const lab = label(labelsText[k] || k, 0.85); lab.position.set(0, 0.32, 0.75); lab.visible = false; g.add(lab);
    refs.labels[k] = lab;

    refs.sides[k] = { group: g, zip, fabric, bar, fabTop, fabH, glass, panels, finalX, stackX: finalX[0], hit, hl };
  }
  function applySideProgress(k) {
    const r = refs.sides[k]; if (!r) return;
    const a = anim.sides[k];
    r.zip.visible = a.zip > 0.002;
    r.fabric.scale.y = Math.max(0.002, a.zip);
    r.bar.position.y = r.fabTop - r.fabH * a.zip;
    r.glass.visible = a.glass > 0.002;
    r.panels.forEach((p, i) => { p.position.x = r.stackX + (r.finalX[i] - r.stackX) * a.glass; });
    dirty = true;
  }

  function applyLabels() {
    Object.entries(refs.labels).forEach(([k, sp]) => {
      const parent = sp.parent; const pos = sp.position.clone();
      disposeTree(sp);
      const n = label(labelsText[k] || k, 0.85); n.position.copy(pos); n.visible = step === 6;
      parent.add(n); refs.labels[k] = n;
    });
  }
  function applyHighlight() {
    Object.entries(refs.sides).forEach(([k, r]) => { r.hl.visible = step === 6 && (hoverSide === k || panelSide === k); });
    Object.values(refs.labels).forEach(l => { l.visible = step === 6; });
    dirty = true;
  }

  /* ---------- Farben / Optionen ---------- */
  function applyColors(s) {
    mats.frame.color.set(COLORS[s.colorFrame].hex);
    mats.roof.color.set(COLORS[s.colorRoof].hex);
    mats.fabric.color.set(s.colorRoof === 'ral7016' ? '#4A4E52' : COLORS[s.colorRoof].hex);
  }
  function applyOptions(s) {
    if (refs.ledStrips) refs.ledStrips.visible = !!s.options.led;
    for (let n = 1; n <= 4; n++) if (refs.heaters[n]) refs.heaters[n].visible = s.options.heaters === n;
    if (refs.louvers && refs.louvers.solar) refs.louvers.solar.visible = !!s.options.solar;
    applySun();
  }
  function applySides(s) {
    ['front', 'left', 'right', 'back'].forEach(k => {
      const type = activeSides(s).includes(k) ? s.sides[k] : 'open';
      if (sideTarget[k] === type) return;
      const first = sideTarget[k] === undefined;
      sideTarget[k] = type;
      const a = anim.sides[k];
      const zt = type === 'zip' ? 1 : 0, gt = type === 'glass' ? 1 : 0;
      tween('zip-' + k, a.zip, zt, first ? 0 : 900, v => { a.zip = v; applySideProgress(k); });
      tween('glass-' + k, a.glass, gt, first ? 0 : 700, v => { a.glass = v; applySideProgress(k); });
    });
  }

  /* ---------- Tag / Abend ---------- */
  const lerp = (a, b, k) => a + (b - a) * k;
  /* Richtung (Szene) zu einem Kompass-Azimut/Höhenwinkel – abhängig von der Ausrichtung der Terrasse.
     Blick vom Haus in den Garten = +z; rechts davon (im Uhrzeigersinn) = −x. */
  function dirTo(azDeg, altDeg) {
    const rel = (azDeg - lastState.azimuth) * DEG, e = altDeg * DEG;
    return new T.Vector3(-Math.sin(rel) * Math.cos(e), Math.sin(e), Math.cos(rel) * Math.cos(e));
  }
  const MOON_DIR = { x: -0.5, y: 0.75, z: 0.45 };
  /* Sonnenstand → Licht, Schatten, Himmel, Abendstimmung */
  function applySun() {
    if (!lights.sun || !lastState) return;
    const { alt, az } = solar(anim.time, anim.date, lastState.site);
    const n = nightFactor(alt);
    const center = new T.Vector3(0, 0, lastState.depth / 200);
    let dir;
    if (alt > 0) {
      const k = clamp(alt / 15, 0, 1);
      dir = dirTo(az, alt);
      lights.sun.intensity = lerp(0.55, 2.6, k);
      lights.sun.color.set(0xFFB06A).lerp(new T.Color(0xFFF1DC), k);
    } else {
      dir = new T.Vector3(MOON_DIR.x, MOON_DIR.y, MOON_DIR.z).normalize();
      lights.sun.intensity = 0.22 * n;
      lights.sun.color.set(0x8FA6D6);
    }
    lights.sun.target.position.copy(center);
    lights.sun.position.copy(center).addScaledVector(dir, 18);
    if (refs.sunDisc) {
      refs.sunDisc.position.copy(center).addScaledVector(dirTo(az, alt), pathR);
      refs.sunDisc.visible = sunMode && alt > -1.5;
    }
    const golden = clamp(1 - Math.abs(alt - 2) / 9, 0, 1) * (1 - n * 0.7);
    applyNight(n, golden);
  }
  function applyNight(n, golden = 0) {
    if (!lights.sun) return;
    const s = lastState;
    const top = hexToVec(SKY.day.top).lerp(hexToVec(SKY.night.top), n).lerp(hexToVec(0xB8A6C2), golden * 0.35);
    const hor = hexToVec(SKY.day.horizon).lerp(hexToVec(SKY.night.horizon), n).lerp(hexToVec(0xF3C08E), golden * 0.65);
    groups.sky.material.uniforms.top.value.copy(top);
    groups.sky.material.uniforms.horizon.value.copy(hor);
    scene.fog.color.setRGB(hor.x, hor.y, hor.z, T.SRGBColorSpace);
    lights.hemi.intensity = lerp(0.7, 0.04, n);
    envMats.forEach(m => { m.envMapIntensity = (m.userData.envBase ?? 1) * lerp(1, 0.12, n); });
    const led = s && s.options.led, heaters = s ? s.options.heaters : 0;
    mats.led.emissiveIntensity = lerp(0.35, 2.6, n);
    lights.led1.intensity = lights.led2.intensity = led ? lerp(0, 1.6, n) : 0;
    mats.heaterGlow.emissiveIntensity = lerp(0.35, 3.5, n);
    lights.heat.intensity = heaters ? lerp(0, 0.8 + heaters * 0.5, n) : 0;
    mats.doorGlass.emissiveIntensity = lerp(0, 0.09, n);
    mats.water.emissiveIntensity = lerp(0, 0.5, n);
    renderer.toneMappingExposure = lerp(1.0, 1.05, n);
    dirty = true;
  }

  /* ---------- Sonnenbahn: Bogen mit Stundenmarken, Kompassring, Sonnenscheibe ---------- */
  function buildSunPath() {
    if (!lastState || !scene) return;
    const sig = [lastState.azimuth, lastState.site.lat, lastState.site.lon, lastState.width, lastState.depth, anim.date, JSON.stringify(sceneTexts.compass || {}), sceneTexts.hour].join('|');
    if (sig === pathSig) { applySun(); return; }
    pathSig = sig;
    disposeTree(groups.sunpath);
    const g = new T.Group(); groups.sunpath = g; g.visible = sunMode; scene.add(g);
    const W = lastState.width / 100, D = lastState.depth / 100;
    pathR = Math.max(W, D) / 2 + 4;
    const center = new T.Vector3(0, 0, D / 2);
    const own = (m) => { m.userData.ownMaterial = true; return m; };
    const ring = new T.Mesh(new T.RingGeometry(pathR - 0.025, pathR + 0.025, 120), own(new T.MeshBasicMaterial({ color: 0x2B2D30, transparent: true, opacity: 0.45, depthWrite: false })));
    ring.rotation.x = -Math.PI / 2; ring.position.copy(center).setY(0.012); g.add(ring);
    const C = sceneTexts.compass || { N: 'N', E: 'E', S: 'S', W: 'W' };
    [['N', 0], ['E', 90], ['S', 180], ['W', 270]].forEach(([k, a]) => {
      const tick = box(0.04, 0.01, 0.5, own(new T.MeshBasicMaterial({ color: 0x2B2D30 })), 0, 0.015, 0, false);
      const d = dirTo(a, 0); tick.position.copy(center).addScaledVector(d, pathR).setY(0.015); tick.lookAt(center.x, 0.015, center.z); g.add(tick);
      const lb = label(C[k], 1.5); lb.position.copy(center).addScaledVector(d, pathR + 1.0).setY(0.35); g.add(lb);
    });
    const tt = sunTimes(anim.date, lastState.site);
    const pts = [];
    for (let h = tt.rise; h <= tt.set + 1e-6; h += 0.1) {
      const sp = solar(h, anim.date, lastState.site);
      pts.push(center.clone().addScaledVector(dirTo(sp.az, Math.max(0, sp.alt)), pathR));
    }
    if (pts.length > 2) {
      const curve = new T.CatmullRomCurve3(pts);
      const tube = new T.Mesh(new T.TubeGeometry(curve, 160, 0.05, 6, false), own(new T.MeshBasicMaterial({ color: 0xE2A04A, fog: false, depthTest: false, transparent: true, opacity: 0.9 })));
      tube.renderOrder = 6; g.add(tube);
    }
    const dotMat = own(new T.MeshBasicMaterial({ color: 0xC9832E, fog: false, depthTest: false, transparent: true }));
    for (let h = Math.ceil(tt.rise); h <= Math.floor(tt.set); h++) {
      const sp = solar(h, anim.date, lastState.site);
      const pos = center.clone().addScaledVector(dirTo(sp.az, sp.alt), pathR);
      const dot = new T.Mesh(new T.SphereGeometry(h % 3 === 0 ? 0.14 : 0.08, 12, 8), dotMat); dot.position.copy(pos); dot.renderOrder = 7; g.add(dot);
      if (h % 3 === 0 && sceneTexts.hour) { const lb = label(sceneTexts.hour.replace('{h}', h), 1.15); lb.position.copy(pos).add(new T.Vector3(0, 0.55, 0)); g.add(lb); }
    }
    const disc = new T.Mesh(new T.SphereGeometry(0.5, 24, 16), own(new T.MeshBasicMaterial({ color: 0xFFC447, fog: false, depthTest: false, transparent: true })));

    applySun();
  }

  /* ---------- Kamera ---------- */
  const PRESETS = {
    1: { az: 0.6, pol: 1.18, k: 1.2, ty: 1.1 },
    2: { az: 0.78, pol: 1.12, k: 1.35, ty: 1.2 },
    3: { az: 0.12, pol: 0.95, k: 1.18, ty: 0.7 },
    4: { az: 0.32, pol: 1.0, k: 1.0, ty: 1.9 },
    5: { az: 1.0, pol: 1.22, k: 0.82, ty: 1.6 },
    6: { az: 0.55, pol: 0.9, k: 1.22, ty: 1.0 },
    7: { az: 0.18, pol: 1.3, k: 0.95, ty: 1.4 },
    8: { az: 0.6, pol: 1.12, k: 1.28, ty: 1.2 },
    9: { az: 0.6, pol: 1.12, k: 1.28, ty: 1.2 },
    sun: { az: 0.35, pol: 0.8, k: 0.92, ty: 0.8 }
  };
  function presetPose(n) {
    const s = lastState, p = PRESETS[n] || PRESETS[1];
    const W = s.width / 100, D = s.depth / 100;
    const r = n === 'sun' ? pathR + 0.8 : 0.5 * Math.sqrt(W * W + D * D + 2.8 * 2.8) + 0.4;
    const vfov = T.MathUtils.degToRad(camera.fov);
    const hfov = 2 * Math.atan(Math.tan(vfov / 2) * camera.aspect);
    const d = clamp((r / Math.sin(Math.min(vfov, hfov) / 2)) * p.k, 4, 24);
    const target = new T.Vector3(0, p.ty, D / 2);
    const pos = new T.Vector3(d * Math.sin(p.pol) * Math.sin(p.az), d * Math.cos(p.pol), d * Math.sin(p.pol) * Math.cos(p.az)).add(target);

  function flyTo(n, ms = 1100) {
    if (!ready) return;
    const to = presetPose(n);
    if (reducedMotion.matches) { camera.position.copy(to.pos); controls.target.copy(to.target); controls.update(); dirty = true; return; }
    camTween = { t0: performance.now(), ms, fromPos: camera.position.clone(), fromT: controls.target.clone(), toPos: to.pos, toT: to.target };
  }
  function stepCam(now) {
    const c = camTween; const k = clamp((now - c.t0) / c.ms, 0, 1), e = ease(k);
    camera.position.lerpVectors(c.fromPos, c.toPos, e);
    controls.target.lerpVectors(c.fromT, c.toT, e);

  function idleRotate(dt) {
    const off = camera.position.clone().sub(controls.target);
    const sph = new T.Spherical().setFromVector3(off);
    sph.theta += idleDir * 0.12 * dt;
    if (lastState.mount === 'wall' && Math.abs(sph.theta) > 0.95) { idleDir *= -1; sph.theta = Math.sign(sph.theta) * 0.95; }

    camera.position.copy(controls.target).add(off);

  /* ---------- Picking (Schritt 6) ---------- */
  const raycaster = { r: null };
  function pickAt(ev) {
    const rect = renderer.domElement.getBoundingClientRect();
    const v = new T.Vector2(((ev.clientX - rect.left) / rect.width) * 2 - 1, -((ev.clientY - rect.top) / rect.height) * 2 + 1);
    raycaster.r = raycaster.r || new T.Raycaster();

  /* ---------- Loop ---------- */
  function loop(now) {
    rafId = requestAnimationFrame(loop);
    const dt = Math.min(0.05, (now - (lastT || now)) / 1000); lastT = now;
    let active = stepTweens(now);
    if (camTween) active = stepCam(now) || active;
    else if (!reducedMotion.matches && hasInteracted !== 'dragging' && now - lastInteract > 6000) { idleRotate(dt); active = true; }
    const moved = controls.update();
    if (active || moved || dirty) {
      renderer.render(scene, camera); dirty = false;
      perfSample(dt);
    } else { perf.frames = 0; perf.acc = 0; }
  }
  function perfSample(dt) {
    if (perf.degraded) return;
    perf.frames++; perf.acc += dt;
    if (perf.frames >= 90) {
      if (perf.acc / perf.frames > 1 / 28) {
        perf.degraded = true;
        renderer.setPixelRatio(1);
        renderer.shadowMap.enabled = false;
        scene.traverse(o => { if (o.material) o.material.needsUpdate = true; });
        resize();
        if (DEBUG) console.info('[scene] Leistung reduziert (Schatten aus, DPR 1)');
      }
      perf.frames = 0; perf.acc = 0;
    }
  }
  function updateRunning() {
    const should = ready && pageVisible && inView;
    if (should && !running) { running = true; lastT = 0; dirty = true; rafId = requestAnimationFrame(loop); }
    if (!should && running) { running = false; cancelAnimationFrame(rafId); }
  }
  function resize() {
    if (!ready) return;
    const w = host.clientWidth, h = host.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();

  }

  /* ---------- Öffentliche API ---------- */
  function hasWebGL() {
    try { const c = document.createElement('canvas'); return !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl'))); }
    catch (e) { return false; }
  }

  async function init(el, cb) {
    Object.assign(callbacks, cb);
    host = el;
    if (!hasWebGL()) throw new Error('no-webgl');
    if (HTMLScriptElement.supports && !HTMLScriptElement.supports('importmap')) throw new Error('no-importmap');
    const [three, oc, re] = await Promise.all([
      import('three'),
      import('three/addons/controls/OrbitControls.js'),
      import('three/addons/environments/RoomEnvironment.js')
    ]);
    T = three; OrbitControls = oc.OrbitControls; RoomEnvironment = re.RoomEnvironment;

    renderer = new T.WebGLRenderer({ antialias: window.devicePixelRatio < 2, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = T.PCFSoftShadowMap;
    renderer.toneMapping = T.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    host.appendChild(renderer.domElement);
    renderer.domElement.setAttribute('role', 'img');

    scene = new T.Scene();
    camera = new T.PerspectiveCamera(40, 1, 0.1, 200);
    const pm = new T.PMREMGenerator(renderer);
    scene.environment = pm.fromScene(new RoomEnvironment(renderer), 0.04).texture;
    pm.dispose();

    makeTextures();
    makeMaterials();
    makeEnvironment();

    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enablePan = false;
    controls.minDistance = 3;
    controls.maxDistance = 24;
    controls.minPolarAngle = 0.15;
    controls.maxPolarAngle = 1.42;          // nie unter den Boden
    controls.rotateSpeed = 0.7;
    controls.addEventListener('start', () => { camTween = null; hasInteracted = 'dragging'; lastInteract = performance.now(); callbacks.onInteract && callbacks.onInteract(); });
    controls.addEventListener('end', () => { hasInteracted = true; lastInteract = performance.now(); });
    controls.addEventListener('change', () => { dirty = true; });

    const cv = renderer.domElement;
    cv.addEventListener('pointerdown', e => { downPos = { x: e.clientX, y: e.clientY, t: performance.now() }; });
    cv.addEventListener('pointerup', e => {
      if (!pickEnabled || !downPos) return;
      const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
      if (moved < 8 && performance.now() - downPos.t < 500) {

      }

    });

      if (!pickEnabled || e.pointerType !== 'mouse' || e.buttons) return;
      const side = pickAt(e);
      if (side !== hoverSide) { hoverSide = side; cv.style.cursor = side ? 'pointer' : ''; applyHighlight(); }
    });
    cv.addEventListener('pointerleave', () => { if (hoverSide) { hoverSide = null; applyHighlight(); } });
    cv.addEventListener('webglcontextlost', e => { e.preventDefault(); callbacks.onContextLost && callbacks.onContextLost(); });

    document.addEventListener('visibilitychange', () => { pageVisible = !document.hidden; updateRunning(); });
    new IntersectionObserver(entries => { inView = entries[0].isIntersecting; updateRunning(); }).observe(host);

    ready = true;
    resize();
    return true;
  }

  function sync(s) {
    lastState = JSON.parse(JSON.stringify(s));
    if (!ready) return;
    const sig = [s.model, s.mount, s.width, s.depth, s.purpose === 'pool', s.options.lightband].join('|');
    const first = !structSig;
    if (sig !== structSig) {
      structSig = sig;
      build(lastState);
      if (first) { const p = presetPose(step); camera.position.copy(p.pos); controls.target.copy(p.target); controls.update(); }
      else { clearTimeout(refitTimer); refitTimer = setTimeout(() => { if (!hasInteracted || performance.now() - lastInteract > 1500) flyTo(step, 700); }, 350); }
    }
    applyColors(lastState);
    applySides(lastState);
    buildSunPath();
    applyOptions(lastState);
    const M = MODELS[s.model];
    if (M.type === 'bio' && anim.louver > M.louverMax) setLouver(M.louverMax);
    dirty = true;
  }

  function setStep(n) {
    step = n;
    pickEnabled = n === 6;
    if (!ready) return;
    if (sunMode) setSunMode(false, false);
    if (groups.dims) groups.dims.visible = n === 3;
    if (n !== 6) { hoverSide = null; panelSide = null; }
    applyHighlight();
    flyTo(n);
    lastInteract = performance.now();
    if (n === 4 && !wowDone && lastState && MODELS[lastState.model].type === 'bio') { wowDone = true; setTimeout(playLouverDemo, reducedMotion.matches ? 0 : 900); }
    dirty = true;
  }
  function setLouver(deg, animate = false) {
    tweens.delete('louver');
    if (!animate) { anim.louver = deg; setLouverMatrices(deg); return; }
    tween('louver', anim.louver, deg, 1300, v => { anim.louver = v; setLouverMatrices(v); callbacks.onLouver && callbacks.onLouver(v); });
  }
  function playLouverDemo() {
    if (reducedMotion.matches || !lastState) return;
    const max = MODELS[lastState.model].louverMax;
    if (!max) return;
    tween('louver', anim.louver, max, 1400, v => { anim.louver = v; setLouverMatrices(v); callbacks.onLouver && callbacks.onLouver(v); }, () => {

      }, 500);
    });

  function setExtend(e) { anim.extend = e; updateFabric(e); }
  /* Uhrzeit setzen (animiert = Sonne wandert sichtbar) */
  function setTime(h, animate = false, ms = 1500, onDone) {
    tweens.delete('time');
    if (!ready) { anim.time = h; return; }
    if (!animate) { anim.time = h; applySun(); return; }
    tween('time', anim.time, h, ms, v => { anim.time = v; applySun(); callbacks.onTime && callbacks.onTime(v); }, onDone);
  }
  /* Tagesverlauf vom Sonnenaufgang bis nach Sonnenuntergang abspielen */
  function playDay() {
    const tt = sunTimes(anim.date, lastState.site);
    const from = anim.time >= tt.set + 0.4 ? tt.rise - 0.2 : anim.time;
    anim.time = from;
    const ms = reducedMotion.matches ? 0 : Math.max(2500, (tt.set + 0.6 - from) * 800);
    setTime(tt.set + 0.6, true, ms, () => callbacks.onPlayEnd && callbacks.onPlayEnd());
    if (reducedMotion.matches) { callbacks.onTime && callbacks.onTime(anim.time); callbacks.onPlayEnd && callbacks.onPlayEnd(); }

    if (groups.dims) groups.dims.visible = !on && step === 3;

    lastInteract = performance.now();
  }
