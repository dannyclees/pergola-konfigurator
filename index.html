  function analyse(data, lat, lon) {
    const kx = Math.cos(lat * DEG) * 111320, ky = 110574;
    const polys = (data.elements || []).filter(e => e.type === 'way' && e.geometry && e.geometry.length >= 4).map(e => {
      const pts = e.geometry.map(g => [(g.lon - lon) * kx, (g.lat - lat) * ky]);
      const f = pts[0], l = pts[pts.length - 1];
      if (Math.hypot(f[0] - l[0], f[1] - l[1]) < 0.01) pts.pop();

    });
    if (!polys.length) return null;
    const inside = (pts) => { let c = false; for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) { const [xi, yi] = pts[i], [xj, yj] = pts[j]; if ((yi > 0) !== (yj > 0) && 0 < (xj - xi) * (0 - yi) / (yj - yi) + xi) c = !c; } return c; };
    const dist = (pts) => Math.min(...pts.map((p, i) => { const q = pts[(i + 1) % pts.length]; const dx = q[0] - p[0], dy = q[1] - p[1]; const k = clamp(-(p[0] * dx + p[1] * dy) / (dx * dx + dy * dy || 1), 0, 1); return Math.hypot(p[0] + k * dx, p[1] + k * dy); }));
    let mainIdx = polys.findIndex(inside);
    if (mainIdx < 0) { const d = polys.map(dist); mainIdx = d.indexOf(Math.min(...d)); if (d[mainIdx] > 25) return null; }
    const main = polys[mainIdx];
    const area2 = main.reduce((a, p, i) => { const q = main[(i + 1) % main.length]; return a + p[0] * q[1] - q[0] * p[1]; }, 0);
    const ccw = area2 > 0;
    const edges = main.map((p, i) => {
      const q = main[(i + 1) % main.length], dx = q[0] - p[0], dy = q[1] - p[1];
      const nx = ccw ? dy : -dy, ny = ccw ? -dx : dx;            // Außennormale
      const az = ((Math.atan2(nx, ny) / DEG) + 360) % 360;
      return { a: p, b: q, len: Math.hypot(dx, dy), az: Math.round(az * 10) / 10 };
    }).filter(e => e.len >= 1.2);
    const round = (pts) => pts.map(([x, y]) => [Math.round(x * 100) / 100, Math.round(y * 100) / 100]);
    return { main: round(main), others: polys.filter((_, i) => i !== mainIdx).map(round), edges };
  }

  function planSVG(b) {
    const xs = b.main.map(p => p[0]), ys = b.main.map(p => p[1]);
    const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
    const half = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)) / 2 + 9;
    const vb = `${(cx - half).toFixed(2)} ${(-cy - half).toFixed(2)} ${(2 * half).toFixed(2)} ${(2 * half).toFixed(2)}`;
    const pts = (arr) => arr.map(([x, y]) => `${x},${-y}`).join(' ');
    const sel = state.azSource === 'osm' ? b.edges.find(e => Math.abs(e.az - state.azimuth) < 0.6) : null;
    let arrow = '';
    if (sel) {
      const mx = (sel.a[0] + sel.b[0]) / 2, my = (sel.a[1] + sel.b[1]) / 2;
      const ux = Math.sin(state.azimuth * DEG), uy = Math.cos(state.azimuth * DEG);
      arrow = `<line x1="${mx}" y1="${-my}" x2="${mx + ux * 5}" y2="${-(my + uy * 5)}" stroke="var(--accent)" stroke-width="3" vector-effect="non-scaling-stroke" marker-end="url(#arr)"/>
        <line x1="${sel.a[0]}" y1="${-sel.a[1]}" x2="${sel.b[0]}" y2="${-sel.b[1]}" stroke="var(--accent)" stroke-width="6" vector-effect="non-scaling-stroke" pointer-events="none"/>`;
    }
    return `<svg class="map" viewBox="${vb}" role="group" aria-label="${esc(t('geo.tapFacade'))}">
      <defs><marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--accent)"/></marker></defs>
      ${b.others.map(o => `<polygon points="${pts(o)}" fill="#E8E4DE" stroke="#D2CCC3" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join('')}
      <polygon points="${pts(b.main)}" fill="#FFFFFF" stroke="#2B2D30" stroke-width="2" vector-effect="non-scaling-stroke"/>
      ${b.edges.map((e, i) => `<line class="edge-hit" data-act="facade" data-az="${e.az}" data-fk="edge-${i}" tabindex="0" role="button" aria-label="${esc(t('geo.facade', { deg: Math.round(e.az), dir: dir16(e.az) }))}" x1="${e.a[0]}" y1="${-e.a[1]}" x2="${e.b[0]}" y2="${-e.b[1]}" stroke-width="24" vector-effect="non-scaling-stroke" stroke-linecap="round"/><line class="edge-vis" x1="${e.a[0]}" y1="${-e.a[1]}" x2="${e.b[0]}" y2="${-e.b[1]}" stroke="transparent" stroke-width="5" vector-effect="non-scaling-stroke" pointer-events="none"/>`).join('')}

      <circle cx="0" cy="0" r="0.7" fill="var(--muted)"/>
    </svg>`;
  }

  function sectionHTML() {
    const g = state.geo;
    const status = {
      searching: `<p class="geo-status" role="status">${esc(t('geo.searching'))}</p>`,
      none: `<p class="geo-status err" role="alert">${esc(t('geo.none'))}</p>`,
      error: `<p class="geo-status err" role="alert">${esc(t('geo.error'))}</p>`,
      denied: `<p class="geo-status err" role="alert">${esc(t('geo.denied'))}</p>`,
      building: `<p class="geo-status" role="status">${esc(t('geo.loadingBuilding'))}</p>`,
      nobuilding: `<p class="geo-status">${esc(t('geo.noBuilding'))}</p>`
    }[g.status] || '';
    return `<h2 id="siteTitle">${esc(t('geo.title'))}</h2>
      <p class="note" style="margin:-4px 0 12px">${esc(t('geo.sub'))}</p>
      <form class="addr" id="geoForm" role="search" novalidate>
        <label for="geoQuery" class="sr-only">${esc(t('geo.ph'))}</label>

  /* ---------- Preis mit Zählanimation (400 ms) ---------- */
  function renderPrice() {
    const p = calcPrice(state);
    if (priceLocked()) { shownPrice = null; els.priceValue.innerHTML = rangeHTML(p.low, p.high); return; }
    if (PRICE_MODE === 'from') {
      const v = fromPrice(state.model);
      els.priceValue.textContent = `${t('price.from')} ${fmtEur(v)}`;
      return;
    }
    const target = { low: p.low, high: p.high };
    const paint = (lo, hi) => { els.priceValue.textContent = priceText(lo, hi); };
    if (!shownPrice || reducedMotion.matches) { shownPrice = target; paint(target.low, target.high); }
    else if (shownPrice.low !== target.low || shownPrice.high !== target.high) {
      cancelAnimationFrame(priceAnim);
      const from = { ...shownPrice }, t0 = performance.now();
      const tick = (now) => {
        const k = clamp((now - t0) / 400, 0, 1), e = 1 - Math.pow(1 - k, 3);
        const lo = k < 1 ? Math.round((from.low + (target.low - from.low) * e) / 50) * 50 : target.low;
        const hi = k < 1 ? Math.round((from.high + (target.high - from.high) * e) / 50) * 50 : target.high;
        shownPrice = { low: lo, high: hi }; paint(lo, hi);
        if (k < 1) priceAnim = requestAnimationFrame(tick);
      };
      priceAnim = requestAnimationFrame(tick);
    } else paint(target.low, target.high);
    clearTimeout(liveTimer);
    liveTimer = setTimeout(() => { els.priceLive.textContent = t('price.live', { price: priceText(p.low, p.high) }); }, 1200);

    },

    8: () => state.ui.formMode ? Lead.formHTML() : summaryView()
  };

  /* 3D-Vorschaubilder der Modellkarten (aus der laufenden Szene gerendert, je Farbe/Größe zwischengespeichert) */
  const thumbCache = {};
  const thumbKey = (k) => [k, state.mount, state.colorFrame, state.colorRoof, state.width, state.depth].join('|');
  let thumbTimer = 0;
  function ensureThumbs() {
    if (state.step !== 3 || viewerState !== 'ready') return;
    const missing = ROOF_TYPES[state.roofType].filter(k => !thumbCache[thumbKey(k)]);
    if (!missing.length) return;
    clearTimeout(thumbTimer);
    thumbTimer = setTimeout(() => {
      if (state.step !== 3) return;
      const keys = Object.fromEntries(missing.map(k => [k, thumbKey(k)]));
      const res = Scene3D.makeThumbs(state, missing);
      Object.entries(res).forEach(([k, url]) => {
        thumbCache[keys[k]] = url;
        const el = document.querySelector(`[data-art="${k}"]`);
        if (el && keys[k] === thumbKey(k)) el.innerHTML = `<img src="${url}" alt="">`;
      });
    }, 120);
  }

  /* Modell-Silhouette (Axonometrie, 120 × 80) – Platzhalter, bis das 3D-Vorschaubild fertig ist */
  function modelArt(k) {
    const st = MODELS[k].style;
    const ink = '#2B2D30', top0 = 24, dx = 12, dy = 11;
    const P = { slim: [5, 3.5], bevel: [8, 4.5], groove: [11, 6], cornice: [8, 4.5], glass: [5, 3.5], pvc: [6, 4], fabric: [4, 3] }[st];
    const bh = P[0], pw = P[1];
    const x0 = 14, x1 = 100, y0 = top0;
    const pts = (a) => a.map(p => p.join(',')).join(' ');
    let topFill = '#55595E', topExtra = '';
    // Dachfläche je Typ
    if (st === 'glass') {
      topFill = '#D6E3E8';
      for (let i = 1; i < 4; i++) { const x = x0 + (x1 - x0) * i / 4; topExtra += `<path d="M${x} ${y0}L${x + dx} ${y0 - dy - 3}" stroke="${ink}" stroke-width="1"/>`; }
    } else if (st === 'pvc' || st === 'fabric') {
      topFill = st === 'pvc' ? '#E4E0DA' : '#D8CFC2';
      const n = st === 'pvc' ? 5 : 3;
      for (let i = 1; i < n; i++) { const tt = i / n, ax = x0 + dx * tt, ay = y0 - dy * tt; topExtra += `<path d="M${ax} ${ay}Q${(ax + x1 + dx * tt) / 2} ${ay + (st === 'pvc' ? 3 : 1.5)} ${x1 + dx * tt} ${ay}" stroke="#8C857B" stroke-width="1" fill="none"/>`; }
    } else {
      for (let i = 1; i < 7; i++) { const tt = i / 7; topExtra += `<path d="M${x0 + dx * tt} ${y0 - dy * tt}L${x1 + dx * tt} ${y0 - dy * tt}" stroke="#9CA1A6" stroke-width="1.1"/>`; }
    }
    const roofTopY = st === 'glass' ? y0 - dy - 3 : y0 - dy;
    let svg = `<svg viewBox="0 0 126 80" fill="none" stroke-linejoin="round">
      <path d="M4 74h118" stroke="#C9C1B5" stroke-width="1.2"/>
      <rect x="${x1 + dx - pw}" y="${roofTopY + bh}" width="${pw}" height="${74 - 8 - roofTopY - bh}" fill="${ink}" opacity=".55"/>
      <polygon points="${pts([[x0, y0], [x1, y0], [x1 + dx, roofTopY], [x0 + dx, roofTopY]])}" fill="${topFill}"/>
      ${topExtra}
      <polygon points="${pts([[x1, y0], [x1 + dx, roofTopY], [x1 + dx, roofTopY + bh], [x1, y0 + bh]])}" fill="#3A3D41"/>`;
    // Frontträger je Profil
    if (st === 'bevel') svg += `<polygon points="${pts([[x0, y0], [x1, y0], [x1, y0 + bh - 3], [x1 - 3, y0 + bh], [x0 + 3, y0 + bh], [x0, y0 + bh - 3]])}" fill="${ink}"/>
      <path d="M${x0 + 3} ${y0 + bh}L${x1 - 3} ${y0 + bh}" stroke="#7A7F85" stroke-width="1"/>`;
    else svg += `<rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${bh}" fill="${ink}"/>`;
    if (st === 'groove') svg += `<path d="M${x0} ${y0 + bh * 0.58}H${x1}" stroke="#8A8F95" stroke-width="1"/>`;
    if (st === 'cornice') svg += `<rect x="${x0 - 2}" y="${y0 - 2}" width="${x1 - x0 + 4}" height="2.6" fill="${ink}"/>`;
    // Pfosten vorne
    svg += `<rect x="${x0}" y="${y0 + bh}" width="${pw}" height="${74 - y0 - bh}" fill="${ink}"/><rect x="${x1 - pw}" y="${y0 + bh}" width="${pw}" height="${74 - y0 - bh}" fill="${ink}"/>`;
    // Typisches Merkmal
    if (st === 'groove') svg += `<rect x="${x0 + pw}" y="${y0 + bh}" width="${x1 - x0 - 2 * pw}" height="${74 - y0 - bh}" fill="${ink}" opacity=".16"/>`;   // ZIP unsichtbar im Profil
    if (st === 'cornice') svg += `<polygon points="${pts([[x0 + dx * 0.15, y0 - dy * 0.15], [x1 + dx * 0.15, y0 - dy * 0.15], [x1 + dx * 0.3, y0 - dy * 0.3], [x0 + dx * 0.3, y0 - dy * 0.3]])}" fill="#D6E3E8" opacity=".9"/>`;
    if (st === 'fabric') svg += `<path d="M${x0 + pw} ${y0 + bh + 1}Q${(x0 + x1) / 2} ${y0 + bh + 7} ${x1 - pw} ${y0 + bh + 1}" stroke="#8C857B" stroke-width="1.2"/>`;
    return svg + '</svg>';
  }

  function summaryRows(withEdit) {
    const s = state, o = s.options;
    const roofType = MODELS[s.model].type;
    let colors = `${t('s5.frame')}: ${t('s5.colors.' + s.colorFrame)} · ${t('s5.roof.' + roofType)}: ${t('s5.colors.' + s.colorRoof)}`;
    if (s.customRal) colors += ` (${s.customRal})`;
    const comfort = [o.led && t('s7.led.t'), o.heaters && t('s8.heatersN', { n: o.heaters }), o.sensor && t('s7.sensor.t'),
      o.smarthome && t('s7.smarthome.t'), o.solar && t('s7.solar.t'), o.lightband && t('s7.lightband.t')].filter(Boolean).join(' · ') || t('ui.none');
    const rows = [
      [1, 'purpose', s.purpose ? t(`s1.${s.purpose}.t`) : '—'],
      [2, 'mount', t(`s2.${s.mount}.t`)],
      [2, 'orientation', `${t('orient.value', { deg: s.azimuth, dir: dir16(s.azimuth) })} · ${UI.siteLabel()}`],
      [3, 'model', `${modelLabel(s.model)} (${t(`roof.types.${roofType}.t`)})`],
      [4, 'size', `${fmtM(s.width)} × ${fmtM(s.depth)} · ${fmtArea(s.width, s.depth)}`],
      [5, 'colors', colors],
      [6, 'sides', activeSides(s).map(k => `${t('side.' + k)}: ${t('s6.opt.' + s.sides[k])}`).join(' · ')],
      [7, 'comfort', comfort]
    ];
    return `<dl class="summary">${rows.map(([n, k, v]) => `<div class="sum-row"><dt>${esc(t('s8.sum.' + k))}</dt><dd>${esc(v)}</dd>
      ${withEdit ? `<button type="button" class="edit" data-goto="${n}" aria-label="${esc(t('ui.edit'))}: ${esc(t('s8.sum.' + k))}">${esc(t('ui.edit'))}</button>` : ''}</div>`).join('')}</dl>`;
  }

  function refArt(kind) {
    const glass = kind === 'glass';
    return `<svg viewBox="0 0 320 200" aria-hidden="true" fill="none" stroke="#2B2D30" stroke-width="2" stroke-linecap="round">
      <rect width="320" height="200" fill="#EDE9E3" stroke="none"/>
      <path d="M0 168h320" stroke="#B9B1A5"/>
      ${glass ? '<path d="M60 70l200-14v12L60 82z" fill="#DCE6EA"/>' : '<path d="M60 64h200v14H60z" fill="#E4DFD7"/>'}
      ${glass ? '' : Array.from({ length: 9 }, (_, i) => `<path d="M${76 + i * 21} 66l8 10" stroke-width="1.5"/>`).join('')}
      <path d="M66 ${glass ? 80 : 78}v90M254 ${glass ? 66 : 78}v90"/>
      ${kind === 'zip' ? '<path d="M70 80h180v80H70z" fill="#5A5C5F" fill-opacity=".35" stroke="none"/>' + Array.from({ length: 8 }, (_, i) => `<path d="M70 ${88 + i * 10}h180" stroke="#5A5C5F" stroke-width=".6" stroke-opacity=".5"/>`).join('') : ''}
      ${kind === 'led' ? Array.from({ length: 10 }, (_, i) => `<circle cx="${74 + i * 19}" cy="82" r="2.5" fill="#C98A3E" stroke="none"/>`).join('') : ''}
      ${glass ? '<path d="M70 72v8M120 69v8M170 65v8M220 62v8" stroke-width="1.2"/>' : ''}
      <path d="M120 168v-28h60v28M110 140h80" stroke-width="1.5"/>
    </svg>`;
  }

  function summaryView() {
    const p = calcPrice(state);
    return `${head(8)}
      ${summaryRows(true)}
      <div class="big-price">${PRICE_MODE === 'from' ? esc(`${t('price.from')} ${fmtEur(fromPrice(state.model))}`) : rangeHTML(p.low, p.high)}</div>
      <p class="note" style="margin-top:0">${esc(PRICE_MODE === 'from' ? t('price.fromNote') : priceLocked() ? t('price.blurNote') : t('price.note'))}</p>
      <div class="ctas">
        <button type="button" class="btn btn-primary btn-block" data-act="cta" data-val="quote" data-fk="cta-quote">${icon('mail')}${esc(t(priceLocked() ? 's8.ctaUnlock' : 's8.ctaQuote'))}</button>
        <button type="button" class="btn btn-secondary btn-block" data-act="cta" data-val="showroom" data-fk="cta-showroom">${icon('pin')}${esc(t('s8.ctaShowroom'))}</button>
        <p class="fine">${esc(t('s8.ctaFine'))}</p>
      </div>
      <div class="trust">
        <div class="seal" aria-hidden="true"><b>${esc(t('s8.seal').toUpperCase())}</b><span>${esc(t('s8.sealSub'))}</span></div>
        <div><p>${esc(t('s8.trust'))}</p><small>${esc(t('s8.trustSub'))}</small>
          ${GOOGLE_RATING ? `<small>★★★★★ ${esc(t('s8.rating', GOOGLE_RATING))}</small>` : ''}</div>
      </div>
      <h2>${esc(t('s8.refsTitle'))}</h2>
      <div class="refs">${REFERENCES.map(r => {
        const txt = t('s8.refs.' + r.key);
        return `<figure class="ref" style="margin:0">
          <div class="img">${r.image ? `<img src="${esc(r.image)}" alt="${esc(txt.text)}" loading="lazy" style="width:100%;height:100%;object-fit:cover">` : `${refArt(r.art)}<small>${esc(t('s8.photoSoon'))}</small>`}</div>
          <figcaption class="cap"><b>${esc(txt.place)}</b><span>${esc(txt.text)}</span></figcaption></figure>`;
      }).join('')}</div>
      <p style="margin-top:20px"><button type="button" class="linkbtn" data-act="copy" data-fk="copy">${icon('link')}${esc(t('ui.copy'))}</button></p>`;
  }

  function thanksView() {
    const p = calcPrice(state);
    const showroom = state.leadType === 'showroom';
    return `<div class="thanks-ic">${icon('check')}</div>
      <h1 tabindex="-1" id="stepTitle">${esc(t('thanks.title', { name: state.lead.firstName }))}</h1>
      <p class="sub">${esc(showroom ? t('thanks.textShowroom') : t('thanks.textQuote'))}</p>
      ${summaryRows(false)}
      ${PRICE_MODE !== 'from' && !priceLocked() ? `<div class="big-price">${esc(priceText(p.low, p.high))}</div><p class="note" style="margin-top:0">${esc(t('price.note'))}</p>` : ''}
      <p class="note">${esc(t('thanks.showroom'))}</p>
      <div class="ctas"><button type="button" class="btn btn-ghost btn-block" data-act="again" data-fk="again">${esc(t('thanks.again'))}</button>
      <button type="button" class="linkbtn" data-act="copy" data-fk="copy">${icon('link')}${esc(t('ui.copy'))}</button></div>
      ${!WEBHOOK_URL ? `<p class="demo-note">${esc(t('thanks.demo'))}</p>` : ''}`;
  }

  function panelSig() {
    const cfg = { ...state, ui: { formMode: state.ui.formMode, sending: state.ui.sending, formError: !!state.ui.formError }, lead: null, view: null, utm: null };
    if (state.step === 4) { cfg.width = cfg.depth = 0; }
    if (state.step === 5) { cfg.customRal = cfg.customRal ? 1 : 0; }
    cfg.geoQuery = null;
    if (state.step === 2) { cfg.azimuth = 0; cfg.azSource = 0; }   // Ausrichtung wird in syncPanel aktualisiert (Slider bleibt greifbar)
    if (state.step === 8 && state.ui.formMode) return JSON.stringify([8, 'form', state.lang, state.ui.formMode, state.ui.sending]);
    return JSON.stringify(cfg);
  }

  function renderPanel() {
    const sig = panelSig();
    const stepChanged = state.step !== lastStepRendered || (state.step === 8 && els.panelBody.dataset.form !== String(!!state.ui.formMode));
    if (sig !== lastPanelSig) {
      const fk = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.fk : null;
      const html = state.step === 9 ? thanksView() : STEPS[state.step]();
      els.panelBody.innerHTML = `<div class="${stepChanged ? 'step' : ''}">${html}</div>`;
      els.panelBody.dataset.form = String(!!state.ui.formMode);
      lastPanelSig = sig;
      if (stepChanged) {
        els.panelScroll.scrollTop = 0;
        if (lastStepRendered) { const h = $('#stepTitle'); h && h.focus({ preventScroll: true }); }
        lastStepRendered = state.step;
      } else if (fk) {
        const n = els.panelBody.querySelector(`[data-fk="${fk}"]`);
        n && n.focus({ preventScroll: true });
      }
    }
    syncPanel();
  }

  /* Werte, die sich beim Ziehen ändern, ohne Neuaufbau aktualisieren */
  function syncPanel() {
    ensureThumbs();
    if (state.step === 4) {
      ['width', 'depth'].forEach(k => {
        const num = $(`#${k}Num`), rng = $(`#${k}Range`), msg = $(`#${k}Msg`);
        if (!num) return;
        const lim = limitsFor(state.model, state.mount, state.width, state.depth)[k === 'width' ? 'w' : 'd'];
        // Bereich hängt vom anderen Maß ab (z. B. Varia: 7,20 m breit nur bis 4,50 m tief)
        if (+rng.min !== lim[0] || +rng.max !== lim[1]) {
          rng.min = num.min = lim[0]; rng.max = num.max = lim[1];
          const mm = rng.nextElementSibling; if (mm) mm.innerHTML = `<span>${fmtM(lim[0])}</span><span>${fmtM(lim[1])}</span>`;
        }
        if (document.activeElement !== num) num.value = state[k];
        rng.value = state[k]; setRangeFill(rng);
        msg.textContent = state.ui.dimMsg[k] || '';
        msg.hidden = !state.ui.dimMsg[k];
      });
      $('#areaVal').textContent = fmtArea(state.width, state.depth);
      const L = limitsFor(state.model, state.mount, state.width, state.depth);
      const E = limitsFor(state.model, state.mount);                       // Gesamthülle aller Ausführungen
      const atW = state.width >= L.w[1], atD = state.depth >= L.d[1];
      const hint = $('#dimHint');
      const parts = [];
      // Andere Ausführung erlaubt mehr: z. B. breiter, wenn weniger tief
      if (atW && L.w[1] < E.w[1]) { const c = limitConfigs(state.model, state.mount).find(c => c.w[1] === E.w[1]); parts.push(`<p>${esc(t('dims.altWide', { w: fmtM(c.w[1]), d: fmtM(c.d[1]) }))}</p>`); }
      if (atD && L.d[1] < E.d[1]) { const c = limitConfigs(state.model, state.mount).find(c => c.d[1] === E.d[1]); parts.push(`<p>${esc(t('dims.altDeep', { d: fmtM(c.d[1]), w: fmtM(c.w[1]) }))}</p>`); }
      if ((atW && L.w[1] >= E.w[1]) || (atD && L.d[1] >= E.d[1]) || state.ui.dimWanted) {
        const want = state.ui.dimWanted || { w: state.width + (atW ? 10 : 0), d: state.depth + (atD ? 10 : 0) };
        const alt = suggestModel(want.w, want.d);
        parts.push(`<p>${esc(t('dims.bigger'))}</p>`);
        if (alt) parts.push(`<p>${esc(t('dims.suggest', { model: modelLabel(alt) }))}</p>
          <button type="button" class="linkbtn" data-act="model" data-val="${alt}" data-fk="suggest">${esc(t('dims.choose', { model: modelLabel(alt) }))} ${icon('next')}</button>`);
      }
      if (parts.length) hint.innerHTML = parts.join('');
      hint.hidden = !parts.length;
    }
    if (state.step === 2) {
      document.querySelectorAll('[data-act="azimuth"]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.val === state.azimuth)));
      const r = $('#azRange'); if (r) { if (document.activeElement !== r) r.value = state.azimuth; setRangeFill(r); }
      const o = $('#azOut'); if (o) o.textContent = t('orient.value', { deg: state.azimuth, dir: dir16(state.azimuth) });
      const pb = $('#planBox');
      const key = state.azSource + state.azimuth;
      if (pb && state.geo.building && pb.dataset.key !== key) {
        const fk = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.fk : null;
        pb.innerHTML = Geo.planSVG(state.geo.building); pb.dataset.key = key;
        if (fk && fk.startsWith('edge-')) { const n = pb.querySelector(`[data-fk="${fk}"]`); n && n.focus({ preventScroll: true }); }
      }
    }
    if (state.step === 8 && state.ui.formMode) Lead.syncErrors();
  }

  function suggestModel(w, d) {
    const order = [...ROOF_TYPES[MODELS[state.model].type], ...Object.keys(MODELS)];
    return order.find(k => k !== state.model && fitsModel(k, state.mount, w, d)) || null;
  }

  function setRangeFill(r) {
    const min = +r.min, max = +r.max, v = +r.value;
    r.style.setProperty('--p', ((v - min) / (max - min || 1)) * 100 + '%');
  }

  /* ---------- Qualitäts-Hotspots ---------- */
  const HS_STEPS = [3, 5, 8];
  let hsKeys = '', hsOpen = null;
  function hotspotsVisible() {
    return viewerState === 'ready' && HS_STEPS.includes(state.step) && !state.view.sunOpen && !(state.step === 8 && state.ui.formMode);
  }
  function renderHotspots() {
    const show = hotspotsVisible();
    els.hotspots.hidden = !show;
    if (!show) { closeHotspot(); return; }
    const list = Scene3D.projectHotspots();
    const keys = list.map(h => h.key).join(',') + state.lang;
    if (keys !== hsKeys) {
      hsKeys = keys;
      els.hotspots.innerHTML = list.map(h => `<button type="button" class="hs" data-hs="${h.key}" aria-expanded="false" aria-label="${esc(t('hs.' + h.key + '.t'))}"><i>+</i></button>`).join('');
      if (hsOpen && !list.some(h => h.key === hsOpen)) closeHotspot();
    }
    positionHotspots(list);
  }
  function positionHotspots(list) {
    if (els.hotspots.hidden) return;
    (list || Scene3D.projectHotspots()).forEach(h => {
      const b = els.hotspots.querySelector(`[data-hs="${h.key}"]`); if (!b) return;
      b.style.transform = `translate(${h.x.toFixed(1)}px, ${h.y.toFixed(1)}px)`;
      // nicht unter den Bedienelementen am unteren Bildrand (Regler) oder rechts (Navigation) anzeigen
      const vw = els.viewer.clientWidth, vh = els.viewer.clientHeight;
      const free = h.y < vh - 78 && h.y > 60 && h.x > 24 && h.x < vw - 68;
      b.style.visibility = h.visible && free ? 'visible' : 'hidden';
    });
  }
  function openHotspot(key) {
    hsOpen = key;
    const M = MODELS[state.model];
    els.hsTitle.textContent = t('hs.' + key + '.t');
    els.hsText.textContent = t('hs.' + key + '.d', { max: M.louverMax || '' });
    els.hsClose.setAttribute('aria-label', t('ui.hsClose'));
    els.hsCard.hidden = false;
    els.hotspots.querySelectorAll('.hs').forEach(b => b.setAttribute('aria-expanded', String(b.dataset.hs === key)));
    track('hotspot_open', { key, model: state.model });
  }
  function closeHotspot() {
    hsOpen = null; els.hsCard.hidden = true;
    els.hotspots.querySelectorAll('.hs').forEach(b => b.setAttribute('aria-expanded', 'false'));
  }

  /* ---------- Komfort-Optionen im 3D-Modell zeigen ---------- */
  function showOption(k) {
    if (viewerState !== 'ready') return;
    if (k === 'smarthome') return;                         // kein sichtbares Bauteil
    // Solar und Lichtband bei Tageslicht zeigen, danach wieder Abendstimmung
    const needsDay = (k === 'solar' || k === 'lightband') && isNight(state.view, state.site);
    const back = state.view.time;
    if (needsDay) Scene3D.setTime(sunTimes(state.view.date, state.site).day, true);
    Scene3D.focusOption(k, () => { if (needsDay && state.step === 7) Scene3D.setTime(back, true); });
  }

  /* ---------- Sonnenverlauf (Overlay) ---------- */
  function siteLabel() {
    const st = state.site;
    return st.label || (st.source === 'default' ? t('geo.defaultSite') : t('geo.savedSite'));
  }
  function fmtTime(h) {
    const m = Math.round(h * 60) % 1440, hh = Math.floor(m / 60), mm = String(m % 60).padStart(2, '0');
    return state.lang === 'fr' ? `${hh} h ${mm}` : `${hh}:${mm}`;
  }
  function syncSun() {
    const v = state.view, tt = sunTimes(v.date, state.site);
    els.dayNight.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.night === '1') === isNight(v, state.site))));
    els.sunBtn.setAttribute('aria-expanded', String(!!v.sunOpen));
    els.sunBtn.setAttribute('aria-label', t('sun.open'));
    els.rainBtn.setAttribute('aria-label', t('ui.rain'));
    els.sunPanel.hidden = !v.sunOpen || viewerState !== 'ready';
    if (els.sunPanel.hidden) return;
    els.sunTimes.setAttribute('aria-label', t('sun.time'));
    els.sunTimes.querySelectorAll('button').forEach(b => { b.textContent = fmtTime(+b.dataset.hour); b.setAttribute('aria-pressed', String(Math.abs(v.time - b.dataset.hour) < 0.01)); });
    els.sunMeta.textContent = t('sun.riseSet', { rise: fmtTime(tt.rise), set: fmtTime(tt.set) });
    const sp = solar(v.time, v.date, state.site);
    els.sunOrientNote.textContent = sp.alt > 0 ? t('sun.altitude', { alt: sp.alt.toFixed(1).replace('.', ','), az: Math.round(sp.az) }) : t('sun.below');
    els.sunPlace.textContent = t('sun.place', { place: siteLabel(), deg: state.azimuth, dir: dir16(state.azimuth) });
    els.sunEdit.textContent = t('sun.edit');
  }
  function openSun(on) {
    if (on === !!state.view.sunOpen) return;
    state.view.sunOpen = on;
    Scene3D.setSunMode(on);
    if (on) track('sun_view', { azimuth: state.azimuth, site_source: state.site.source, model: state.model });
    renderChrome();
  }
  function setSunTime(h, animate) {
    state.view.time = h; state.view.autoNight = false;
    Scene3D.setTime(h, animate);
    syncSun();
  }

  /* ---------- Navigation ---------- */
  function goStep(n) {
    n = clamp(n, 1, 9);
    if (n > state.maxStep + 1 && n !== 9) return;
    const prev = state.step;
    const view = { ...state.view, sunOpen: false };
    const tt = sunTimes(view.date, state.site);
    if (n === 7 && !isNight(view, state.site)) { view.prevTime = view.time; view.time = tt.evening; view.autoNight = true; Scene3D.setTime(view.time, true); }
    if (prev === 7 && n !== 7 && view.autoNight) { view.time = view.prevTime ?? tt.day; view.autoNight = false; Scene3D.setTime(view.time, true); }
    setState({ step: n, maxStep: Math.max(state.maxStep, Math.min(n, 8)), view, ui: { dimMsg: { width: '', depth: '' }, dimWanted: null, formMode: n === 8 ? state.ui.formMode : null } }, { quiet: true });
    Scene3D.setStep(n);
    if (n <= 8) trackStep(n);
  }
  function next() {
    if (state.step === 1 && !state.purpose) { toast(t('ui.chooseFirst')); return; }
    if (state.step === 8) { Lead.open('quote'); return; }
    goStep(state.step + 1);
  }
  function back() {
    if (state.step === 8 && state.ui.formMode) { Lead.close(); return; }
    goStep(state.step - 1);
  }

  /* ---------- Ereignisse ---------- */
  let autoTimer = 0;
  function bind() {
    els.nextBtn.addEventListener('click', next);
    els.priceValue.addEventListener('click', () => { if (priceLocked()) toast(state.step === 8 ? t('price.blurHint8') : t('price.blurHint')); });
    els.backBtn.addEventListener('click', back);
    els.langSwitch.addEventListener('click', e => {
      const b = e.target.closest('[data-lang]'); if (!b) return;
      setLang(b.dataset.lang);
    });
    els.progress.addEventListener('click', e => { const b = e.target.closest('[data-goto]'); if (b && !b.disabled) goStep(+b.dataset.goto); });
    els.dayNight.addEventListener('click', e => {
      const b = e.target.closest('[data-night]'); if (!b) return;
      const tt = sunTimes(state.view.date, state.site);
      setSunTime(b.dataset.night === '1' ? tt.evening : tt.day, true);
    });
    els.sunBtn.addEventListener('click', () => openSun(!state.view.sunOpen));
    els.rainBtn.addEventListener('click', () => {
      const type = MODELS[state.model].type;
      if (Scene3D.playRain(() => { els.rainBtn.setAttribute('aria-pressed', 'false'); })) {
        els.rainBtn.setAttribute('aria-pressed', 'true');
        toast(t('rain.' + type), 7000);
        track('rain_demo', { model: state.model });
      }
    });
    els.hotspots.addEventListener('click', e => {
      const b = e.target.closest('[data-hs]'); if (!b) return;
      if (hsOpen === b.dataset.hs) closeHotspot(); else openHotspot(b.dataset.hs);
    });
    els.hsClose.addEventListener('click', closeHotspot);
    els.viewerNav.addEventListener('click', e => {
      const b = e.target.closest('[data-orbit]'); if (!b) return;
      hideDragHint();
      if (b.dataset.orbit === 'reset') Scene3D.resetView(); else Scene3D.orbitBy(+b.dataset.orbit);
    });
    els.sunTimes.addEventListener('click', e => { const b = e.target.closest('[data-hour]'); if (b) { setSunTime(+b.dataset.hour, true); syncSun(); } });
    els.sunEdit.addEventListener('click', () => { goStep(2); setTimeout(() => { const h = document.getElementById('siteTitle'); h && h.scrollIntoView({ block: 'start', behavior: reducedMotion.matches ? 'auto' : 'smooth' }); }, 60); });
    els.louverRange.addEventListener('input', () => {
      const M = MODELS[state.model];
      if (M.type === 'bio') { state.view.louver = +els.louverRange.value; Scene3D.setLouver(state.view.louver); els.louverOut.textContent = t('a11y.louverValue', { v: state.view.louver }); }
      else { state.view.extend = +els.louverRange.value / 100; Scene3D.setExtend(state.view.extend); els.louverOut.textContent = els.louverRange.value + ' %'; }
      setRangeFill(els.louverRange);
    });

    const pb = els.panelBody;
    pb.addEventListener('click', e => {
      const g = e.target.closest('[data-goto]');
      if (g) { goStep(+g.dataset.goto); return; }
      const b = e.target.closest('[data-act]');
      if (!b || b.disabled) return;
      const v = b.dataset.val;
      switch (b.dataset.act) {
        case 'purpose':
          applyPurpose(v);
          clearTimeout(autoTimer); autoTimer = setTimeout(() => { if (state.step === 1) goStep(2); }, 320);
          break;
        case 'mount':
          setState({ mount: v, mountTouched: true });
          break;
        case 'azimuth':
          setState({ azimuth: +v, azSource: 'manual' });
          break;
        case 'facade':
          setState({ azimuth: Math.round(+b.dataset.az), azSource: 'osm' });
          break;
        case 'geoPick': Geo.pick(+v); break;
        case 'geoLocate': Geo.locate(); break;
        case 'sunOpen':
          openSun(true);
          break;
        case 'roofType': {
          if (state.roofType === v) break;
          const list = ROOF_TYPES[v];
          const m = list.includes(state.recommended) ? state.recommended : list[0];
          setState({ model: m, modelTouched: true });
          if (v === 'bio') setTimeout(() => Scene3D.setLouver(MODELS[m].louverMax * 0.6, true), 300);
          break;
        }
        case 'model':
          setState({ model: v, modelTouched: true, ui: { dimMsg: { width: '', depth: '' }, dimWanted: null } });
          break;
        case 'colorFrame': setState({ colorFrame: v }); break;
        case 'colorRoof': setState({ colorRoof: v }); break;
        case 'side':
          setState({ sides: { ...state.sides, [b.dataset.side]: v }, sidesTouched: true });
          break;
        case 'toggle': {
          const k = b.dataset.opt;
          const on = !state.options[k];
          setState({ options: { ...state.options, [k]: on } });
          if (on) showOption(k);
          break;
        }
        case 'heaters':
          setState({ options: { ...state.options, heaters: state.options.heaters + +v } });
          if (+v > 0) showOption('heaters');
          break;
        case 'cta': Lead.open(v); break;
        case 'formBack': Lead.close(); break;
        case 'copy': copyLink(); break;
        case 'again': setState({ step: 8, ui: { formMode: null } }, { quiet: true }); Scene3D.setStep(8); break;
      }
    });
    pb.addEventListener('input', e => {
      const el = e.target;
      if (el.dataset.dim) {
        const k = el.dataset.dim, v = parseInt(el.value, 10);
        const w = k === 'width' ? v : state.width, d = k === 'depth' ? v : state.depth;
        if (el.dataset.kind === 'range') { setRangeFill(el); setState({ [k]: v, ui: { dimMsg: { ...state.ui.dimMsg, [k]: '' }, dimWanted: null } }); }
        else if (fitsModel(state.model, state.mount, w, d)) setState({ [k]: v, ui: { dimMsg: { ...state.ui.dimMsg, [k]: '' }, dimWanted: null } });
        return;
      }
      if (el.id === 'ralInput') { state.customRal = el.value.slice(0, 20); scheduleHash(); return; }
      if (el.id === 'geoQuery') { state.geoQuery = el.value; return; }
      if (el.id === 'azRange') {
        setRangeFill(el);
        state.azSource = 'manual';
        setState({ azimuth: +el.value }, { quiet: true });
        const o = document.getElementById('azOut'); if (o) o.textContent = t('orient.value', { deg: state.azimuth, dir: dir16(state.azimuth) });
        return;
      }
      Lead.onInput(el);
    });
    pb.addEventListener('change', e => {
      const el = e.target;
      if (el.dataset.dim && el.dataset.kind === 'num') {
        const k = el.dataset.dim, dk = k === 'width' ? 'w' : 'd';
        const E = limitsFor(state.model, state.mount)[dk];                   // Gesamthülle
        const v = parseInt(el.value, 10);
        if (isNaN(v)) { el.value = state[k]; return; }
        const want = { w: k === 'width' ? v : state.width, d: k === 'depth' ? v : state.depth };
        let msg = '', wanted = null;
        if (v > E[1]) { msg = t('dims.max', { max: fmtM(E[1]) }); wanted = want; }
        if (v < E[0]) msg = t('dims.min', { min: fmtM(E[0]) });
        // gewünschtes Maß möglichst halten, notfalls das andere Maß anpassen (andere Ausführung)
        const f = fitLimits(state.model, state.mount, want.w, want.d, dk);
        const other = k === 'width' ? 'depth' : 'width';
        if (!msg && f[other === 'width' ? 'w' : 'd'] !== state[other]) {
          msg = t('dims.otherAdjusted', { dim: t('dims.' + other), val: fmtM(f[other === 'width' ? 'w' : 'd']) });
        }
        el.value = f[dk];
        setState({ width: f.w, depth: f.d, ui: { dimMsg: { ...state.ui.dimMsg, [k]: msg }, dimWanted: wanted } }, { quiet: true });
        return;
      }
      Lead.onInput(e.target);
    });
    pb.addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.target.dataset && e.target.dataset.kind === 'num') { e.target.blur(); }
      if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.act === 'facade') { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
    });
    pb.addEventListener('focusout', e => Lead.onBlur(e.target));
    pb.addEventListener('submit', e => { e.preventDefault(); if (e.target.id === 'geoForm') Geo.search(state.geoQuery); else Lead.submit(); });
    // Seite im Panel ↔ Hervorhebung im 3D-Modell
    const sideHl = (e) => { const r = e.target.closest && e.target.closest('[data-side-row]'); Scene3D.setPanelSide(r ? r.dataset.sideRow : null); };
    pb.addEventListener('pointerover', sideHl);
    pb.addEventListener('focusin', sideHl);
    pb.addEventListener('pointerleave', () => Scene3D.setPanelSide(null));
  }

  function setLang(lang) {
    if (!I18N[lang] || lang === state.lang) return;
    setState({ lang }, { quiet: true });
    Scene3D.setLabels(sceneLabels());
    const q = new URLSearchParams(location.search); q.set('lang', lang);
    try { history.replaceState(null, '', location.pathname + '?' + q.toString() + location.hash); } catch (e) { /* ignore */ }
  }

  async function copyLink() {
    const url = shareUrl();
    try {
      if (navigator.share && matchMedia('(pointer: coarse)').matches) { await navigator.share({ title: t('meta.title'), url }); return; }
      await navigator.clipboard.writeText(url);
      toast(t('ui.copied'));
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      toast(t('ui.copyFail', { url }), 9000);
    }
  }

  function toast(msg, ms = 4200) {
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => els.toast.classList.remove('show'), ms);
  }

  function setViewer(st) {
    viewerState = st;
    els.viewerStatus.hidden = st === 'ready';
    els.viewerTop.hidden = st !== 'ready';
    els.viewerNav.hidden = st !== 'ready';
    renderHotspots();
    els.app.classList.toggle('no3d', st === 'failed');
    renderChrome();
    if (st === 'ready') ensureThumbs();
  }
  function onLouverAnim(v) {
    state.view.louver = v;
    if (MODELS[state.model].type === 'bio') {
      els.louverRange.value = Math.round(v); setRangeFill(els.louverRange);
      els.louverOut.textContent = t('a11y.louverValue', { v: Math.round(v) });
    }
  }
  function hideDragHint() { els.dragHint && els.dragHint.classList.add('gone'); }

  return { shell, renderChrome, renderPanel, renderPrice, toast, goStep, setViewer, onLouverAnim, hideDragHint, setRangeFill, syncSun, siteLabel, renderHotspots, positionHotspots, els: () => els };
})();

function sceneLabels() {
  return {
    sides: { front: t('side.front'), back: t('side.back'), left: t('side.left'), right: t('side.right') },
    compass: { N: t('compass.N'), E: t('compass.E'), S: t('compass.S'), W: t('compass.W') },
    hour: t('sun.hour')
  };
}
function render() {
  UI.renderChrome();
  UI.renderPanel();
  UI.renderPrice();
  Scene3D.sync(state);
  UI.renderHotspots();
  scheduleHash();
  postHeight();
}

/* iframe: Höhe an die Elternseite melden */
let lastHeight = 0;
function postHeight() {
  if (!IN_IFRAME) return;
  const h = document.documentElement.scrollHeight;
  if (h === lastHeight) return;
  lastHeight = h;
  window.parent.postMessage({ type: 'cg-configurator:height', height: h }, '*');
}

/* =====================================================================
   9. LEAD – Formular, Validierung, Versand
   ===================================================================== */
const Lead = (() => {
  let openedAt = 0;
  const REQUIRED = ['firstName', 'email', 'zipCity', 'country', 'timeframe', 'consent'];

  function open(type) {
    openedAt = Date.now();
    setState({ leadType: type, ui: { formMode: type, errors: {}, touched: {}, formError: '' } }, { quiet: true });
    Scene3D.setStep(8);
  }
  function close() { setState({ ui: { formMode: null, formError: '' } }, { quiet: true }); }

  function validateField(k, L = state.lead) {
    const v = typeof L[k] === 'string' ? L[k].trim() : L[k];
    if (REQUIRED.includes(k) && !v) return k === 'consent' ? t('form.errConsent') : t('form.errRequired');
    if (k === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) return t('form.errEmail');
    if (k === 'phone' && v && !/^[+0-9 ()./-]{6,22}$/.test(v)) return t('form.errPhone');
    if (k === 'zipCity' && !/(^|\D)(L-?|B-?)?\d{4}(\D|$)/i.test(v)) return t('form.errZip');
    return '';
  }
  function validateAll() {
    const errors = {};
    ['firstName', 'email', 'phone', 'zipCity', 'country', 'timeframe', 'consent'].forEach(k => { const e = validateField(k); if (e) errors[k] = e; });
    return errors;
  }

  function field(k, type, extra = '') {
    return `<div class="field"><label for="f-${k}">${esc(t('form.' + k))}</label>
      <input type="${type}" id="f-${k}" name="${k}" data-lead="${k}" data-fk="f-${k}" value="${esc(state.lead[k])}" aria-describedby="e-${k}" ${extra}>
      <p class="err" id="e-${k}" hidden></p></div>`;
  }
  function pills(k, options, legend) {
    return `<div class="field"><fieldset><legend id="l-${k}">${esc(legend)}</legend>
      <div class="pills" id="p-${k}" role="radiogroup" aria-labelledby="l-${k}" aria-describedby="e-${k}">
      ${options.map(([val, lab]) => `<label><input type="radio" name="${k}" value="${val}" data-lead="${k}" data-fk="f-${k}-${val}" ${state.lead[k] === val ? 'checked' : ''}><span>${esc(lab)}</span></label>`).join('')}
      </div><p class="err" id="e-${k}" hidden></p></fieldset></div>`;
  }

  function formHTML() {
    const showroom = state.ui.formMode === 'showroom';
    return `<button type="button" class="linkbtn" data-act="formBack" data-fk="formBack">${icon('prev')}${esc(t('form.back'))}</button>
      <h1 tabindex="-1" id="stepTitle" style="margin-top:8px">${esc(t(showroom ? 'form.titleShowroom' : 'form.titleQuote'))}</h1>
      <p class="sub">${esc(t(showroom ? 'form.introShowroom' : 'form.introQuote'))}${priceLocked() ? ' ' + esc(t('form.introUnlock')) : ''}</p>
      <form class="form" id="leadForm" novalidate>
        ${field('firstName', 'text', 'autocomplete="given-name" required')}
        ${field('email', 'email', 'autocomplete="email" inputmode="email" required')}
        ${field('phone', 'tel', 'autocomplete="tel" inputmode="tel"')}
        ${field('zipCity', 'text', `autocomplete="postal-code" required placeholder="${esc(t('form.zipPh'))}"`)}
        ${pills('country', [['LU', t('form.LU')], ['BE', t('form.BE')]], t('form.country'))}
        ${pills('timeframe', [['now', t('form.now')], ['3m', t('form.3m')], ['later', t('form.later')]], t('form.timeframe'))}
        ${pills('contactPref', [['email', t('form.byEmail')], ['phone', t('form.byPhone')], ['whatsapp', t('form.byWhatsapp')]], t('form.contactPref'))}
        ${showroom ? pills('slot', [['weekday_am', t('form.weekdayAm')], ['weekday_pm', t('form.weekdayPm')], ['saturday', t('form.saturday')]], t('form.slot')) : ''}
        <div class="field">
          <label class="consent"><input type="checkbox" data-lead="consent" data-fk="f-consent" id="f-consent" ${state.lead.consent ? 'checked' : ''} aria-describedby="e-consent">
            <span>${esc(t('form.consent'))} <a href="${esc(PRIVACY_URL)}" target="_blank" rel="noopener">${esc(t('form.privacy'))}</a></span></label>
          <p class="err" id="e-consent" hidden></p>
        </div>
        <div class="hp" aria-hidden="true"><label>Website<input type="text" name="website" id="f-website" tabindex="-1" autocomplete="off"></label></div>
        <p class="form-error" id="formError" role="alert" hidden></p>
        <button type="submit" class="btn btn-primary btn-block" data-fk="submit" ${state.ui.sending ? 'disabled' : ''}>${esc(state.ui.sending ? t('form.sending') : t(showroom ? 'form.submitShowroom' : 'form.submitQuote'))}</button>
        <p class="fine">${esc(t('s8.ctaFine'))}</p>
      </form>`;
  }

  function onInput(el) {
    const k = el.dataset && el.dataset.lead; if (!k) return;
    const val = el.type === 'checkbox' ? el.checked : el.value;
    state.lead[k] = val;
    if (el.type === 'radio' || el.type === 'checkbox') state.ui.touched[k] = true;
    if (state.ui.touched[k]) { const e = validateField(k); if (e) state.ui.errors[k] = e; else delete state.ui.errors[k]; syncErrors(); }
  }
  function onBlur(el) {
    const k = el.dataset && el.dataset.lead; if (!k || el.type === 'radio') return;
    state.ui.touched[k] = true;
    const e = validateField(k); if (e) state.ui.errors[k] = e; else delete state.ui.errors[k];
    syncErrors();
  }
  function syncErrors() {
    ['firstName', 'email', 'phone', 'zipCity', 'country', 'timeframe', 'contactPref', 'slot', 'consent'].forEach(k => {
      const p = document.getElementById('e-' + k); if (!p) return;
      const msg = state.ui.touched[k] ? state.ui.errors[k] || '' : '';
      p.textContent = msg; p.hidden = !msg;
      const inp = document.getElementById('f-' + k); if (inp) inp.setAttribute('aria-invalid', String(!!msg));
      const grp = document.getElementById('p-' + k); if (grp) grp.classList.toggle('invalid', !!msg);
    });
    if (state.ui.formError && !Object.keys(state.ui.errors).length && !state.ui.sending && state.ui.formError === t('form.errSummary')) state.ui.formError = '';
    const fe = document.getElementById('formError');
    if (fe) { fe.textContent = state.ui.formError || ''; fe.hidden = !state.ui.formError; }
  }

  function buildLead() {
    const s = state, p = calcPrice(s), M = MODELS[s.model], mt = I18N[s.lang].models[s.model];
    const W = s.width / 100, D = s.depth / 100;
    const posts = postPlan(s).count;
    const brand = mt.brand.split(' · ')[0];
    const colorOut = (k) => ({ key: k, code: k === 'custom' ? (s.customRal || null) : COLORS[k].ral, label: I18N[s.lang].s5.colors[k] });
    return {
      schema: 'cg-pergola-lead/1',
      type: s.leadType || 'quote',
      createdAt: new Date().toISOString(),
      lang: s.lang,
      contact: {
        firstName: s.lead.firstName.trim(), email: s.lead.email.trim(), phone: s.lead.phone.trim() || null,
        zipCity: s.lead.zipCity.trim(), country: s.lead.country, timeframe: s.lead.timeframe,
        contactPref: s.lead.contactPref || null, showroomSlot: s.leadType === 'showroom' ? (s.lead.slot || null) : null,
        consent: !!s.lead.consent, consentText: I18N[s.lang].form.consent
      },
      configuration: {
        purpose: s.purpose,
        orientation: { azimuthDeg: s.azimuth, label: dir16(s.azimuth), source: s.azSource },
        site: { lat: +s.site.lat.toFixed(5), lon: +s.site.lon.toFixed(5), country: s.site.country, label: s.site.label, source: s.site.source },
        mount: s.mount,
        roofType: M.type,
        model: { key: s.model, brand, name: mt.name },
        recommendedModel: s.recommended,
        dimensions: { widthCm: s.width, depthCm: s.depth, areaM2: Math.round(W * D * 100) / 100, heightCm: 240, posts },
        colors: { frame: colorOut(s.colorFrame), roof: colorOut(s.colorRoof) },
        sides: activeSides(s).map(k => ({ side: k, lengthM: sideLengthCm(s, k) / 100, type: s.sides[k] })),
        options: { ...s.options }
      },
      price: {
        currency: 'EUR', total: p.P, low: p.low, high: p.high,
        display: priceText(p.low, p.high).replace(/[  ]/g, ' '),
        breakdown: p.breakdown, mode: PRICE_MODE, shownToVisitor: !priceLocked(), pricesVersion: PRICES.pricesVersion
      },
      tracking: s.utm,
      shareUrl: shareUrl()
    };
  }

  async function submit() {
    if (state.ui.sending) return;
    const errors = validateAll();
    const touched = {}; Object.keys(state.lead).forEach(k => { touched[k] = true; });
    state.ui.touched = touched; state.ui.errors = errors;
    if (Object.keys(errors).length) {
      state.ui.formError = t('form.errSummary');
      syncErrors();
      const first = ['firstName', 'email', 'phone', 'zipCity', 'country', 'timeframe', 'consent'].find(k => errors[k]);
      const el = document.getElementById('f-' + first) || document.querySelector(`#p-${first} input`);
      el && el.focus();
      return;
    }
    const hp = document.getElementById('f-website');
    const bot = (hp && hp.value) || Date.now() - openedAt < 2500;
    const lead = buildLead();
    setState({ ui: { sending: true, formError: '' } }, { quiet: true });
    try {
      if (!bot) {
        if (WEBHOOK_URL) {
          // text/plain vermeidet den CORS-Preflight (Make, Zapier, n8n lesen den Body als JSON)
          const res = await fetch(WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify(lead), keepalive: true });
          if (!res.ok) throw new Error('HTTP ' + res.status);
        }
        console.log('[lead] ' + (WEBHOOK_URL ? 'gesendet' : 'DEMO – nicht gesendet'), lead);
        window.__CG_LAST_LEAD__ = lead;
        const evt = lead.type === 'showroom' ? 'lead_showroom' : 'lead_quote';
        track(evt, { ...trackParams(), country: lead.contact.country, timeframe: lead.contact.timeframe });
        if (typeof window.fbq === 'function') window.fbq('track', 'Lead', { value: lead.price.total, currency: 'EUR', content_name: lead.configuration.model.key });
      }
      if (PRICE_REVEAL_AFTER_LEAD) { try { localStorage.setItem('cg_price_unlocked', '1'); } catch (e) { /* privater Modus */ } }
      setState({ step: 9, unlocked: PRICE_REVEAL_AFTER_LEAD, ui: { sending: false, formMode: null } }, { quiet: true });
      Scene3D.setStep(9);
    } catch (err) {
      console.error('[lead] Fehler', err);
      setState({ ui: { sending: false, formError: t('form.errSend', { email: CONTACT_EMAIL }) } }, { quiet: true });
      syncErrors();
    }
  }

  return { open, close, formHTML, onInput, onBlur, submit, syncErrors, buildLead };
})();

/* =====================================================================
   10. BOOT
   ===================================================================== */
(async function boot() {
  if (EMBED) document.documentElement.classList.add('embed');
  const qLang = (QS.get('lang') || '').toLowerCase();
  state.lang = I18N[qLang] ? qLang : 'fr';
  state.utm = readUtm();
  try { state.unlocked = PRICE_REVEAL_AFTER_LEAD && localStorage.getItem('cg_price_unlocked') === '1'; } catch (e) { /* ignore */ }
  const restored = decodeHash(location.hash);
  if (restored) Object.assign(state, restored);
  normalize(state);
  selfTest();

  UI.shell();
  render();
  Scene3D.setStep(state.step);
  track('config_start', { ...trackParams(), restored: !!restored });
  trackStep(state.step);

  window.addEventListener('message', e => {
    if (e.data && e.data.type === 'cg-configurator:consent') consentGranted = !!e.data.granted;
  });
  if (IN_IFRAME) new ResizeObserver(postHeight).observe(document.body);

  try {
    await Scene3D.init(UI.els().canvasHost, {
      onSidePick: (k) => {
        const order = ['open', 'zip', 'glass'];
        const nextV = order[(order.indexOf(state.sides[k]) + 1) % 3];
        setState({ sides: { ...state.sides, [k]: nextV }, sidesTouched: true });
        UI.toast(t('a11y.sideCycle', { side: t('side.' + k), state: t('s6.opt.' + nextV) }), 2000);
      },
      onLouver: UI.onLouverAnim,
      onTime: (h) => { state.view.time = h; UI.syncSun(); },
      onFrame: () => UI.positionHotspots(),
      onInteract: UI.hideDragHint,
      onContextLost: () => UI.setViewer('failed')
    });
    Scene3D.setLabels(sceneLabels());
    Scene3D.sync(state);
    Scene3D.setStep(state.step);
    Scene3D.setDate(state.view.date);
    // Direkt auf Schritt 7 geladen (z. B. geteilter Link): wie beim Weiterklicken in den Abend wechseln
    if (state.step === 7 && !isNight(state.view, state.site)) {
      state.view.prevTime = state.view.time; state.view.autoNight = true;
      state.view.time = sunTimes(state.view.date, state.site).evening;
    }
    Scene3D.setTime(state.view.time);
    UI.setViewer('ready');
    setTimeout(UI.hideDragHint, 7000);
  } catch (err) {
    console.warn('[scene] 3D nicht verfügbar:', err && err.message);
    UI.setViewer('failed');
  }
})();
</script>
</body>
</html>
